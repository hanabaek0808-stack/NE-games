<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e27">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NE Games</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --accent: #6c5ce7; --accent2: #fd79a8; --accent3: #00cec9;
    --text: #fff; --text-dim: #a0a4c0; --coin: #fdcb6e;
    --bg1: #0a0e27; --bg2: #151b3d;
  }
  html, body { height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg1); color: var(--text); user-select: none; -webkit-user-select: none;
    overscroll-behavior: none; }

  body::before {
    content: ''; position: fixed; inset: 0;
    background:
      radial-gradient(circle at 15% 20%, rgba(108,92,231,.35), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(253,121,168,.28), transparent 45%),
      linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
    z-index: -2; animation: bgPulse 12s ease-in-out infinite alternate;
  }
  @keyframes bgPulse { 0% { transform: scale(1); } 100% { transform: scale(1.15); } }

  /* THEMES */
  body.theme-default { --accent: #6c5ce7; --accent2: #fd79a8; --bg1: #0a0e27; --bg2: #151b3d; }
  body.theme-default::before { background: radial-gradient(circle at 15% 20%, rgba(108,92,231,.35), transparent 45%), radial-gradient(circle at 85% 80%, rgba(253,121,168,.28), transparent 45%), linear-gradient(135deg, #0a0e27 0%, #151b3d 100%); }
  body.theme-gold { --accent: #fdcb6e; --accent2: #e17055; --bg1: #1a0e27; --bg2: #2b1a0a; }
  body.theme-gold::before { background: radial-gradient(circle at 15% 20%, rgba(253,203,110,.4), transparent 45%), radial-gradient(circle at 85% 80%, rgba(255,107,107,.3), transparent 45%), linear-gradient(135deg, #1a0e27 0%, #2b1a0a 100%); }
  body.theme-ocean { --accent: #00b4db; --accent2: #0083b0; --bg1: #0a0e27; --bg2: #0a1f38; }
  body.theme-ocean::before { background: radial-gradient(circle at 15% 20%, rgba(0,180,219,.4), transparent 45%), radial-gradient(circle at 85% 80%, rgba(0,131,176,.35), transparent 45%), linear-gradient(135deg, #0a0e27 0%, #0a1f38 100%); }
  body.theme-pink { --accent: #f093fb; --accent2: #f5576c; --bg1: #1a0a1f; --bg2: #2b0a20; }
  body.theme-pink::before { background: radial-gradient(circle at 15% 20%, rgba(240,147,251,.4), transparent 45%), radial-gradient(circle at 85% 80%, rgba(245,87,108,.3), transparent 45%), linear-gradient(135deg, #1a0a1f 0%, #2b0a20 100%); }
  body.theme-forest { --accent: #43e97b; --accent2: #38f9d7; --bg1: #0a1a0e; --bg2: #0a2b15; }
  body.theme-forest::before { background: radial-gradient(circle at 15% 20%, rgba(67,233,123,.4), transparent 45%), radial-gradient(circle at 85% 80%, rgba(56,249,215,.3), transparent 45%), linear-gradient(135deg, #0a1a0e 0%, #0a2b15 100%); }
  body.theme-sunset { --accent: #ff6b6b; --accent2: #feca57; --bg1: #2b0a1a; --bg2: #4a1f0a; }
  body.theme-sunset::before { background: radial-gradient(circle at 15% 20%, rgba(255,107,107,.4), transparent 45%), radial-gradient(circle at 85% 80%, rgba(254,202,87,.35), transparent 45%), linear-gradient(135deg, #2b0a1a 0%, #4a1f0a 100%); }
  body.theme-galaxy { --accent: #a29bfe; --accent2: #6c5ce7; --bg1: #05060f; --bg2: #0a0e27; }
  body.theme-galaxy::before { background: radial-gradient(circle at 15% 20%, rgba(162,155,254,.5), transparent 45%), radial-gradient(circle at 85% 80%, rgba(108,92,231,.4), transparent 45%), linear-gradient(135deg, #05060f 0%, #0a0e27 100%); }
  body.theme-mint { --accent: #00cec9; --accent2: #55efc4; --bg1: #0a1f1e; --bg2: #0a2b2a; }
  body.theme-mint::before { background: radial-gradient(circle at 15% 20%, rgba(0,206,201,.4), transparent 45%), radial-gradient(circle at 85% 80%, rgba(85,239,196,.3), transparent 45%), linear-gradient(135deg, #0a1f1e 0%, #0a2b2a 100%); }
  body.theme-royal { --accent: #c471f5; --accent2: #fa71cd; --bg1: #1a0a2b; --bg2: #2b0a1a; }
  body.theme-royal::before { background: radial-gradient(circle at 15% 20%, rgba(196,113,245,.4), transparent 45%), radial-gradient(circle at 85% 80%, rgba(250,113,205,.35), transparent 45%), linear-gradient(135deg, #1a0a2b 0%, #2b0a1a 100%); }
  body.theme-mono { --accent: #dfe6e9; --accent2: #b2bec3; --bg1: #000; --bg2: #1a1a1a; }
  body.theme-mono::before { background: radial-gradient(circle at 15% 20%, rgba(223,230,233,.2), transparent 45%), radial-gradient(circle at 85% 80%, rgba(178,190,195,.15), transparent 45%), linear-gradient(135deg, #000 0%, #1a1a1a 100%); }
  /* Level themes */
  body.theme-legendary { --accent: #ffd700; --accent2: #ffed4e; --bg1: #1a1400; --bg2: #2b1f00; }
  body.theme-legendary::before { background: radial-gradient(circle at 15% 20%, rgba(255,215,0,.5), transparent 45%), radial-gradient(circle at 85% 80%, rgba(255,237,78,.35), transparent 45%), linear-gradient(135deg, #1a1400 0%, #2b1f00 100%); }

  /* SEASONS */
  body.season-halloween { --accent: #ff7800; --accent2: #9b59b6; }
  body.season-christmas { --accent: #e74c3c; --accent2: #27ae60; }
  body.season-spring { --accent: #ff9bc9; --accent2: #7dd456; }
  body.season-summer { --accent: #ffd93d; --accent2: #4facfe; }

  .orb { position: fixed; border-radius: 50%; filter: blur(60px); opacity: .4;
    pointer-events: none; z-index: -1; animation: float 20s infinite ease-in-out; }
  .orb:nth-child(1) { width: 220px; height: 220px; background: var(--accent); top: 5%; left: -60px; }
  .orb:nth-child(2) { width: 260px; height: 260px; background: var(--accent2); bottom: 5%; right: -80px; animation-delay: -5s; }
  .orb:nth-child(3) { width: 180px; height: 180px; background: var(--accent3); top: 45%; left: 40%; animation-delay: -10s; }
  .orb:nth-child(4) { width: 150px; height: 150px; background: var(--coin); top: 70%; left: 10%; animation-delay: -15s; }
  @keyframes float {
    0%,100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(60px,-40px) scale(1.15); }
    66% { transform: translate(-40px,50px) scale(.9); }
  }

  .app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
    max-width: 480px; margin: 0 auto; position: relative; }

  /* HEADER */
  .header { padding: 12px 14px 6px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand-logo {
    width: 42px; height: 42px; border-radius: 13px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: grid; place-items: center; font-weight: 900; font-size: 15px; color: #fff;
    box-shadow: 0 8px 24px rgba(108,92,231,.5);
    animation: logoPulse 4s ease-in-out infinite;
    position: relative;
  }
  .brand-logo .lvl-badge {
    position: absolute; bottom: -4px; right: -4px;
    min-width: 20px; height: 20px; padding: 0 5px;
    border-radius: 10px; background: linear-gradient(135deg,#fdcb6e,#e17055);
    font-size: 9.5px; font-weight: 900; color: #fff;
    display: grid; place-items: center;
    box-shadow: 0 2px 8px rgba(253,203,110,.6);
    border: 2px solid var(--bg1);
  }
  @keyframes logoPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06) rotate(-3deg); } }
  .brand-text h1 { font-size: 17px; font-weight: 800; letter-spacing: -.5px;
    background: linear-gradient(90deg,#fff,#a29bfe);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .brand-text p { font-size: 9.5px; color: var(--text-dim); font-weight: 600; }
  .brand-text p .rank-name { color: var(--accent); }

  .hdr-right { display: flex; align-items: center; gap: 5px; }
  .coin-pill {
    display: flex; align-items: center; gap: 4px;
    background: linear-gradient(135deg, rgba(253,203,110,.2), rgba(225,112,85,.2));
    border: 1.5px solid rgba(253,203,110,.5); padding: 6px 10px; border-radius: 14px;
    font-weight: 800; font-size: 12.5px;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .coin-pill.bump { transform: scale(1.2); }
  .coin-pill .coin-icon { font-size: 14px; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 10px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1);
    display: grid; place-items: center; cursor: pointer; color: #fff; font-size: 14px;
    transition: all .2s; position: relative;
  }
  .icon-btn:active { transform: scale(.9); }
  .icon-btn .badge-dot {
    position: absolute; top: 2px; right: 2px; width: 9px; height: 9px;
    border-radius: 50%; background: #ff6b6b; box-shadow: 0 0 0 2px var(--bg1);
    animation: dotPulse 1.5s infinite;
  }
  @keyframes dotPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.3); } }

  /* LEVEL BAR */
  .level-bar-wrap {
    padding: 0 14px 8px; flex-shrink: 0;
  }
  .level-bar {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,.05); border-radius: 12px; padding: 8px 12px;
    border: 1px solid rgba(255,255,255,.06);
  }
  .level-info { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .level-num {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: grid; place-items: center; font-weight: 900; font-size: 13px;
    box-shadow: 0 4px 12px rgba(108,92,231,.4);
    position: relative;
  }
  .level-num.rankup { animation: rankUpPulse 1.5s infinite; }
  @keyframes rankUpPulse { 0%,100% { box-shadow: 0 4px 12px rgba(108,92,231,.4); } 50% { box-shadow: 0 4px 20px rgba(253,121,168,.8), 0 0 0 4px rgba(253,121,168,.3); } }
  .level-text { display: flex; flex-direction: column; }
  .level-name { font-size: 11px; font-weight: 800; letter-spacing: .3px; }
  .level-xp { font-size: 9px; color: var(--text-dim); font-weight: 600; }
  .level-progress {
    flex: 1; height: 8px; background: rgba(255,255,255,.08);
    border-radius: 8px; overflow: hidden; position: relative;
  }
  .level-progress-fill {
    height: 100%; border-radius: 8px;
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
    background-size: 200% 100%; animation: xpShine 3s linear infinite;
    transition: width .8s cubic-bezier(.22,1,.36,1);
    position: relative;
  }
  .level-progress-fill::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.4), transparent 50%);
    border-radius: 8px;
  }
  @keyframes xpShine { 0% { background-position: 0 0; } 100% { background-position: 200% 0; } }
  .level-progress-text {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 8px; font-weight: 800; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.5);
    pointer-events: none;
  }

  /* SEARCH */
  .search-wrap { padding: 0 14px 8px; flex-shrink: 0; }
  .search {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px; padding: 9px 12px;
  }
  .search svg { width: 15px; height: 15px; stroke: var(--text-dim); flex-shrink: 0; }
  .search input { flex: 1; background: none; border: none; outline: none; color: #fff; font-size: 12.5px; font-family: inherit; }
  .search input::placeholder { color: var(--text-dim); }

  /* CHIPS */
  .chips { display: flex; gap: 5px; padding: 0 14px 10px; overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    padding: 6px 12px; border-radius: 14px; background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.08); color: var(--text-dim);
    font-size: 10.5px; font-weight: 700; white-space: nowrap; cursor: pointer;
    font-family: inherit; transition: all .3s;
  }
  .chip.active { background: linear-gradient(135deg,var(--accent),var(--accent2)); color: #fff; border-color: transparent; box-shadow: 0 4px 14px rgba(108,92,231,.4); }

  /* CONTENT */
  .content { flex: 1; overflow-y: auto; padding: 0 0 100px; scrollbar-width: none; }
  .content::-webkit-scrollbar { display: none; }

  .section-title { padding: 6px 14px 8px; display: flex; align-items: center; justify-content: space-between; }
  .section-title h2 { font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .section-title span { font-size: 9.5px; color: var(--text-dim); font-weight: 600; }

  .grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 9px; padding: 0 14px 16px; }

  .game-card {
    position: relative; border-radius: 15px; overflow: hidden; aspect-ratio: 1/1.1;
    cursor: pointer; transition: transform .4s cubic-bezier(.34,1.56,.64,1);
    animation: cardIn .5s cubic-bezier(.22,1,.36,1) backwards;
  }
  .game-card:active { transform: scale(.94); }
  .game-card.locked { opacity: .55; }
  .game-card.locked::before {
    content: '🔒'; position: absolute; inset: 0; z-index: 5;
    display: grid; place-items: center; font-size: 40px;
    background: rgba(0,0,0,.5); backdrop-filter: blur(2px);
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .card-bg { position: absolute; inset: 0; display: grid; place-items: center; font-size: 48px; }
  .card-overlay { position: absolute; inset: 0; background: linear-gradient(180deg,transparent 40%,rgba(0,0,0,.85)); }
  .card-content { position: absolute; left: 0; right: 0; bottom: 0; padding: 9px; z-index: 2; }
  .card-content h3 { font-size: 12px; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
  .card-content p { font-size: 9px; color: rgba(255,255,255,.7); margin-top: 1px; }
  .card-badge {
    position: absolute; top: 7px; right: 7px; padding: 3px 6px; border-radius: 6px;
    font-size: 7.5px; font-weight: 800; z-index: 2; letter-spacing: .5px;
  }
  .card-badge.play { background: linear-gradient(135deg,#00cec9,#00b894); color: #fff; }
  .card-badge.soon { background: rgba(255,255,255,.55); color: #0a0e27; }
  .card-badge.hot { background: linear-gradient(135deg,#ff6b6b,#ee5a6f); color: #fff; animation: newPulse 1.5s infinite; }
  .card-badge.farm { background: linear-gradient(135deg,#43e97b,#38f9d7); color: #fff; }
  .card-badge.cook { background: linear-gradient(135deg,#f093fb,#f5576c); color: #fff; }
  .card-badge.event { background: linear-gradient(135deg,#fdcb6e,#e17055); color: #fff; animation: newPulse 1.5s infinite; }
  .card-badge.lock-badge { background: linear-gradient(135deg,#6c5ce7,#a29bfe); color: #fff; }
  @keyframes newPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,107,107,.6); } 50% { box-shadow: 0 0 0 6px rgba(255,107,107,0); } }
  .card-stars { position: absolute; bottom: 36px; left: 9px; z-index: 2; font-size: 9.5px;
    text-shadow: 0 2px 6px rgba(0,0,0,.8); letter-spacing: -1px; }
  .card-lock-info {
    position: absolute; bottom: 42px; left: 9px; right: 9px; z-index: 3;
    font-size: 8.5px; font-weight: 700; color: #fdcb6e; text-align: center;
    text-shadow: 0 2px 4px rgba(0,0,0,.8);
  }

  .scroll-row { display: flex; gap: 8px; padding: 0 14px 14px; overflow-x: auto; scrollbar-width: none; }
  .scroll-row::-webkit-scrollbar { display: none; }

  .quest-card {
    flex-shrink: 0; width: 180px; padding: 10px; border-radius: 13px;
    background: linear-gradient(135deg, rgba(108,92,231,.15), rgba(253,121,168,.1));
    border: 1px solid rgba(255,255,255,.1);
  }
  .quest-card.complete { background: linear-gradient(135deg, rgba(0,206,201,.2), rgba(0,184,148,.15)); border-color: rgba(0,206,201,.5); }
  .quest-top { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .quest-emoji { font-size: 18px; }
  .quest-info { flex: 1; }
  .quest-name { font-size: 10px; font-weight: 700; }
  .quest-reward { font-size: 9px; color: var(--coin); font-weight: 700; }
  .quest-progress { height: 4px; background: rgba(0,0,0,.3); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .quest-progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .5s; }

  .banner {
    margin: 0 14px 10px; padding: 11px 12px; border-radius: 15px;
    display: flex; align-items: center; gap: 9px; cursor: pointer;
    position: relative; overflow: hidden;
  }
  .banner::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
    animation: shine 3s infinite; }
  @keyframes shine { 0% { left: -100%; } 60%,100% { left: 200%; } }
  .banner-daily { background: linear-gradient(135deg, #fdcb6e, #e17055); }
  .banner-gift { background: linear-gradient(135deg, #a29bfe, #6c5ce7); }
  .banner-event { background: linear-gradient(135deg, #ff6b6b, #ee5a6f); }
  .banner-level { background: linear-gradient(135deg, #00b894, #00cec9); }
  .banner .b-emoji { font-size: 26px; }
  .banner .b-text { flex: 1; }
  .banner h3 { font-size: 12.5px; font-weight: 800; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .banner p { font-size: 9.5px; color: rgba(255,255,255,.9); margin-top: 1px; font-weight: 600; }
  .banner .b-btn { padding: 6px 11px; border-radius: 9px; background: rgba(255,255,255,.25);
    color: #fff; font-weight: 800; font-size: 10.5px; border: none; font-family: inherit; }

  /* BOTTOM NAV */
  .bottom-nav {
    position: absolute; bottom: 0; left: 0; right: 0; height: 62px;
    background: rgba(10,14,39,.92); backdrop-filter: blur(30px);
    border-top: 1px solid rgba(255,255,255,.08);
    display: flex; align-items: center; justify-content: space-around; z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 6px; background: none; border: none; color: var(--text-dim); font-family: inherit;
    cursor: pointer; position: relative; transition: all .3s; }
  .nav-item svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; transition: all .3s; }
  .nav-item span { font-size: 8.5px; font-weight: 600; }
  .nav-item.active { color: #fff; }
  .nav-item.active svg { stroke: url(#navGrad); transform: translateY(-2px) scale(1.1); filter: drop-shadow(0 4px 12px rgba(108,92,231,.6)); }
  .nav-item.active::after {
    content: ''; position: absolute; top: 1px; width: 16px; height: 3px; border-radius: 3px;
    background: linear-gradient(90deg,var(--accent),var(--accent2));
    box-shadow: 0 2px 10px rgba(108,92,231,.8);
  }

  /* MODAL */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.85); backdrop-filter: blur(12px);
    display: none; place-items: center; z-index: 300; padding: 20px; }
  .modal.active { display: grid; }
  .modal-box {
    background: linear-gradient(135deg,#1a1f3d,#0f1428);
    border: 1px solid rgba(255,255,255,.1); border-radius: 22px; padding: 22px;
    text-align: center; max-width: 340px; width: 100%; max-height: 85vh; overflow-y: auto;
    animation: modalIn .4s cubic-bezier(.34,1.56,.64,1); scrollbar-width: none;
  }
  .modal-box::-webkit-scrollbar { display: none; }
  .modal-box.rankup-modal {
    background: linear-gradient(135deg,#2b1f00,#1a1400);
    border: 2px solid rgba(255,215,0,.5);
    box-shadow: 0 0 40px rgba(255,215,0,.4);
  }
  @keyframes modalIn { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-emoji { font-size: 46px; margin-bottom: 8px; }
  .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 5px; }
  .modal-desc { font-size: 12px; color: var(--text-dim); margin-bottom: 14px; line-height: 1.5; }
  .modal-btn { width: 100%; padding: 12px; border-radius: 12px; border: none;
    background: linear-gradient(135deg,var(--accent),var(--accent2));
    color: #fff; font-weight: 800; font-size: 13px; cursor: pointer; font-family: inherit;
    box-shadow: 0 8px 20px rgba(108,92,231,.4); margin-top: 6px; }
  .modal-btn:active { transform: scale(.97); }

  /* RANK UP MODAL */
  .rankup-badge {
    width: 100px; height: 100px; margin: 0 auto 12px;
    border-radius: 50%;
    background: linear-gradient(135deg,#ffd700,#ffed4e);
    display: grid; place-items: center; font-size: 48px;
    box-shadow: 0 0 40px rgba(255,215,0,.6);
    animation: rankupSpin 2s ease-in-out infinite;
  }
  @keyframes rankupSpin {
    0%,100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.08) rotate(5deg); }
  }
  .rankup-title { font-size: 24px; font-weight: 900;
    background: linear-gradient(90deg,#ffd700,#ffed4e);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;

   STORAGE & SETTINGS

const Storage = {
  get(k, def) { try { const v = localStorage.getItem('ne_' + k); return v ? JSON.parse(v) : def; } catch { return def; } },
  set(k, v) { try { localStorage.setItem('ne_' + k, JSON.stringify(v)); } catch {} },
};

const Settings = {
  get sound() { return Storage.get('sound', true); },

};

const Sound = {
  ctx: null, enabled: true,
  init() { if (!this.ctx) try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} },
  tone(freq, dur = 0.1, type = 'sine', vol = 0.1) {
    if (!this.enabled) return;
    this.init(); if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + dur);
  },
  coin() { this.tone(1200, 0.08, 'square', 0.08); setTimeout(() => this.tone(1600, 0.1, 'square', 0.06), 40); },
  click() { this.tone(600, 0.05, 'sine', 0.05); },
  correct() { this.tone(700, 0.1, 'sine', 0.08); setTimeout(() => this.tone(1000, 0.15, 'sine', 0.08), 80); },
  wrong() { this.tone(300, 0.15, 'sawtooth', 0.08); setTimeout(() => this.tone(200, 0.2, 'sawtooth', 0.08), 80); },
  win() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, 0.15, 'triangle', 0.08), i * 80)); },
  lose() { [400, 300, 200].forEach((f, i) => setTimeout(() => this.tone(f, 0.2, 'sawtooth', 0.07), i * 100)); },
  pop() { this.tone(800, 0.06, 'sine', 0.06); },
  jump() { this.tone(400, 0.1, 'sine', 0.06); setTimeout(() => this.tone(700, 0.08, 'sine', 0.06), 30); },
  unlock() { [600, 800, 1000, 1200].forEach((f, i) => setTimeout(() => this.tone(f, 0.12, 'sine', 0.09), i * 60)); },
  chop() { this.tone(200, 0.05, 'square', 0.1); },
  sizzle() { for (let i = 0; i < 3; i++) setTimeout(() => this.tone(400 + Math.random()*200, 0.05, 'sawtooth', 0.03), i * 30); },
  plant() { this.tone(500, 0.08, 'sine', 0.06); setTimeout(() => this.tone(800, 0.1, 'sine', 0.06), 50); },
  rankup() { [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => this.tone(f, 0.2, 'triangle', 0.1), i * 100)); }
};

const Level = {
  get xp() { return Storage.get('xp', 0); },
  get level() { return Storage.get('level', 1); },
  xpForLevel(l) { return Math.floor(100 * Math.pow(1.15, l - 1)); },
  get rank() { return RANKS[Math.min(this.level - 1, RANKS.length - 1)]; },
  
  addXP(amount) {
    let xp = this.xp + amount;
    let lvl = this.level;
    const levelUps = [];
    
    while (lvl < 50 && xp >= this.xpForLevel(lvl)) {
      xp -= this.xpForLevel(lvl);
      lvl++;
      levelUps.push(lvl);
    }
    
    Storage.set('level', lvl);
    Storage.set('xp', xp);
    this.render();
    
    // Process level-ups
    levelUps.forEach((newLvl, i) => {
      setTimeout(() => this.onLevelUp(newLvl), i * 800);
    });
  },
  
  onLevelUp(lvl) {
    const rank = RANKS[Math.min(lvl - 1, RANKS.length - 1)];
    Sound.rankup(); 
    confetti(50); 
    Settings.vibrate([100, 50, 100, 50, 200]);
    
    // Milestone rewards
    if (LEVEL_UNLOCKS[lvl]) {
      const unlock = LEVEL_UNLOCKS[lvl];
      // Grant coins
      Player.coins = Player.coins + unlock.bonus;
      // Unlock themes
      const owned = Storage.get('ownedThemes', ['default']);
      unlock.themes.forEach(t => { if (!owned.includes(t)) owned.push(t); });
      Storage.set('ownedThemes', owned);
      // Show rank-up modal
      const rewardItems = [];
      if (unlock.bonus) rewardItems.push(`🪙 +${unlock.bonus} coins`);
      unlock.games.forEach(g => {
        const game = FEATURED.find(x => x.id === g);
        if (game) rewardItems.push(`🎮 ${game.name} unlocked`);
      });
      unlock.themes.forEach(t => {
        const theme = THEMES.find(x => x.id === t);
        if (theme) rewardItems.push(`🎨 ${theme.name} theme unlocked`);
      });
      
      showRankUpModal(lvl, rank, rewardItems);
    } else {
      showToast(`🎉 Level ${lvl}! (${rank.name})`);
      Player.coins = Player.coins + (lvl * 10); // small bonus each level
    }
    
    checkAchievements();
  },
  
  render() {
    const lvl = this.level;
    const rank = this.rank;
    const need = this.xpForLevel(lvl);
    const cur = this.xp;
    const pct = Math.min(100, (cur / need) * 100);
    
    document.getElementById('lvlNum').textContent = lvl;
    document.getElementById('lvlBadge').textContent = lvl;
    document.getElementById('lvlName').textContent = rank.name;
    document.getElementById('rankName').textContent = rank.name;
    document.getElementById('lvlXpText').textContent = `${cur} / ${need} XP`;
    document.getElementById('lvlFill').style.width = pct + '%';
    document.getElementById('lvlPct').textContent = Math.floor(pct) + '%';
    
    // Milestone pulse
    const lvlNum = document.getElementById('lvlNum');
    if (rank.milestone) lvlNum.classList.add('rankup');
    else lvlNum.classList.remove('rankup');
  }
};

  add(n) { this.coins = this.coins + n; if (n > 0) { this.bump(); Sound.coin(); } this.trackEarned(n); },
  spend(n) { if (this.coins < n) return false; this.coins = this.coins - n; Sound.click(); return true; },
  bump() { const p = document.getElementById('coinPill'); p.classList.add('bump'); setTimeout(() => p.classList.remove('bump'), 300); },
  render() { document.getElementById('coinAmount').textContent = this.coins.toLocaleString(); },

};

   ══════════════════════════════════════════════════════════ */
const Stats = {
  get(g) { const s = Storage.get('stats', {}); return s[g] || {}; },
  update(g, field, value) {
    const s = Storage.get('stats', {});
    s[g] = s[g] || {};
    s[g][field] = value;
    if ((s[g][field] || 0) > (s[g].best || 0)) s[g].best = value;
    Storage.set('stats', s);
  },
  incr(g, field, n = 1) {
    const s = Storage.get('stats', {});
    s[g] = s[g] || {};
    s[g][field] = (s[g][field] || 0) + n;
    Storage.set('stats', s);
  },
  all() { return Storage.get('stats', {}); }
};

function buyTheme(id) {
  const t = THEMES.find(x => x.id === id);
  if (!t) return;
  // Level-locked theme
  if (t.levelLocked && Level.level < t.levelLocked) {
    showToast(`🔒 Reach level ${t.levelLocked} to unlock`);
    return;
  }
  const owned = Storage.get('ownedThemes', ['default']);
  if (owned.includes(id)) {
    Storage.set('theme', id); applyTheme(); Sound.click();
    showToast(`🎨 ${t.name} equipped`);
    return;
  }
  if (!Player.spend(t.price)) { showToast('🪙 Not enough coins'); return; }
  owned.push(id);
  Storage.set('ownedThemes', owned);
  Storage.set('theme', id);
  applyTheme();
  Sound.unlock(); confetti(20);
  showToast(`🎨 ${t.name} unlocked!`);
  checkAchievements();
}

    exclusiveGame: 'ice-cream-rush' },
};

function getActiveSeason() {
  const now = new Date();
  const m = now.getMonth(), d = now.getDate();
  for (const [id, s] of Object.entries(SEASONS)) {
    if (s.startMonth === s.endMonth) {
      if (m === s.startMonth && d >= s.startDay && d <= s.endDay) return { id, ...s };
    } else {
      if ((m === s.startMonth && d >= s.startDay) || (m === s.endMonth && d <= s.endDay)) return { id, ...s };
    }
  }
  return null;
}

function applySeason() {
  document.body.classList.remove('season-halloween', 'season-christmas', 'season-spring', 'season-summer');
  const season = getActiveSeason();
  if (season) {
    document.body.classList.add('season-' + season.id);
    spawnSeasonalOverlay(season);
    return season;
  }
  return null;
}

let seasonalTimer = null;
function spawnSeasonalOverlay(season) {
  clearInterval(seasonalTimer);
  document.querySelectorAll('.snow, .seasonal-overlay').forEach(el => el.remove());
  function spawnItem() {
    if (!Settings.animations) return;
    const el = document.createElement('div');
    el.className = 'snow';
    el.textContent = season.items[Math.floor(Math.random() * season.items.length)];
    el.style.left = Math.random() * 100 + '%';
    el.style.fontSize = (10 + Math.random() * 12) + 'px';
    el.style.animationDuration = (8 + Math.random() * 8) + 's';
    el.style.opacity = 0.4 + Math.random() * 0.4;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 18000);
  }
  seasonalTimer = setInterval(spawnItem, 800);
  for (let i = 0; i < 5; i++) setTimeout(spawnItem, i * 200);
}

/* Check if game is unlocked */
function isGameUnlocked(game) {
  const level = Level.level;
  const season = getActiveSeason();
  
  // Level-locked
  if (game.levelLocked && level < game.levelLocked) return false;
  
  // Seasonal exclusive — only available during its season
  if (game.seasonalOnly) {
    if (!season || season.id !== game.seasonalOnly) return false;
  }
  
  return true;
}

function getLockReason(game) {
  if (game.levelLocked && Level.level < game.levelLocked) return `Reach level ${game.levelLocked}`;
  if (game.seasonalOnly) {
    const s = SEASONS[game.seasonalOnly];
    return `${s.emoji} ${s.name} only`;
  }
  return null;
}

function checkAchievements() {
  const claimed = Storage.get('achievements', []);
  const pending = Storage.get('pendingAchievements', []);
  let newPending = [];
  ACHIEVEMENTS.forEach(a => {
    if (!claimed.includes(a.id) && !pending.includes(a.id) && a.check()) newPending.push(a.id);
  });
  if (newPending.length) {
    const allPending = [...pending, ...newPending];
    Storage.set('pendingAchievements', allPending);
    newPending.forEach((id, i) => {
      const a = ACHIEVEMENTS.find(x => x.id === id);
      setTimeout(() => {
        Sound.unlock(); confetti(20);
        showToast(`🏆 ${a.name}!`);
        updateAchievementDot();
      }, i * 700);
    });
  }
  renderAchievements();
}

function claimAchievement(id) {
  const a = ACHIEVEMENTS.find(x => x.id === id);
  if (!a) return;
  const pending = Storage.get('pendingAchievements', []);
  if (!pending.includes(id)) return;
  const claimed = Storage.get('achievements', []);
  claimed.push(id);
  Storage.set('achievements', claimed);
  Storage.set('pendingAchievements', pending.filter(x => x !== id));
  Player.coins = Player.coins + a.reward;
  Level.addXP(30);
  Sound.coin(); confetti(15);
  renderAchievements();
  updateAchievementDot();
  showToast(`✅ ${a.name} +🪙${a.reward}`);
}

/* DAILY */
const Daily = {
  get lastClaim() { return Storage.get('dailyLastClaim', 0); },
  set lastClaim(v) { Storage.set('dailyLastClaim', v); },
  get streak() { return Storage.get('dailyStreak', 0); },
  set streak(v) { Storage.set('dailyStreak', v); },
  canClaim() { return Date.now() - this.lastClaim >= 24 * 60 * 60 * 1000; },
  claim() {
    const now = Date.now(), oneDay = 24 * 60 * 60 * 1000, twoDays = 2 * oneDay;
    const gap = now - this.lastClaim;
    if (gap < oneDay) return;
    if (gap > twoDays && this.lastClaim !== 0) this.streak = 0;
    this.streak = Math.min(this.streak + 1, 7);
    this.lastClaim = now;
    const rewards = [50, 75, 100, 150, 200, 300, 500];
    const reward = rewards[Math.min(this.streak - 1, 6)];
    const season = getActiveSeason();
    const finalReward = season ? Math.round(reward * season.bonus) : reward;
    Player.coins = Player.coins + finalReward;
    Level.addXP(50);
    Sound.win(); confetti(35); Settings.vibrate([50,30,50]);
    showToast(`📅 Day ${this.streak}! +🪙${finalReward}${season ? ' (×' + season.bonus + ')' : ''}`);
    checkAchievements();
    renderDaily();
  }
};

function getTodayQuests() {
  const today = new Date().toDateString();
  const saved = Storage.get('dailyQuests', {});
  if (saved.date === today && saved.quests) return saved;
  const pool = [...QUEST_POOL].sort(() => Math.random() - 0.5).slice(0, 3);
  const quests = pool.map(q => ({ ...q, progress: 0, claimed: false }));
  const data = { date: today, quests };
  Storage.set('dailyQuests', data);
  return data;
}

function updateQuestProgress(type, amount = 1) {
  const data = getTodayQuests();
  let changed = false;
  data.quests.forEach(q => {
    if (q.type === type && !q.claimed) {
      const before = q.progress;
      q.progress = Math.min(q.target, q.progress + amount);
      if (q.progress !== before) changed = true;
      if (q.progress >= q.target && !q.claimed) {
        q.claimed = true;
        Player.coins = Player.coins + q.reward;
        Level.addXP(30);
        Storage.set('questsCompleted', (Storage.get('questsCompleted', 0) || 0) + 1);
        setTimeout(() => { Sound.win(); confetti(15); showToast(`🎯 Quest done! +🪙${q.reward}`); }, 100);
      }
    }
  });
  if (changed) { Storage.set('dailyQuests', data); renderQuests(); checkAchievements(); }
}

function renderQuests() {
  const data = getTodayQuests();
  const row = document.getElementById('questsRow');
  if (!row) return;
  const done = data.quests.filter(q => q.claimed).length;
  document.getElementById('questsDone').textContent = `${done}/3 done`;
  row.innerHTML = data.quests.map(q => {
    const pct = (q.progress / q.target) * 100;
    return `<div class="quest-card ${q.claimed ? 'complete' : ''}">
      <div class="quest-top">
        <div class="quest-emoji">${q.emoji}</div>
        <div class="quest-info">
          <div class="quest-name">${q.name}</div>
          <div class="quest-reward">🪙 ${q.reward}</div>
        </div>
        ${q.claimed ? '<div style="font-size:14px">✅</div>' : ''}
      </div>
      <div class="quest-progress"><div class="quest-progress-bar" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

/* ANIMATIONS */
function flyCoinsToPill(count = 1, fromX, fromY) {
  if (!Settings.animations) { Player.add(count); return; }
  const pill = document.getElementById('coinPill');
  const rect = pill.getBoundingClientRect();
  const tx = rect.left + rect.width / 2, ty = rect.top + rect.height / 2;
  for (let i = 0; i < Math.min(count, 5); i++) {
    const coin = document.createElement('div');
    coin.className = 'fly-coin'; coin.textContent = '🪙';
    coin.style.left = (fromX + (Math.random() - 0.5) * 40) + 'px';
    coin.style.top = (fromY + (Math.random() - 0.5) * 40) + 'px';
    document.body.appendChild(coin);
    const dx = tx - fromX + (Math.random() - 0.5) * 20;
    const dy = ty - fromY + (Math.random() - 0.5) * 20;
    requestAnimationFrame(() => {
      coin.style.transition = 'transform .9s cubic-bezier(.4,-.3,.4,1.3), opacity .9s ease';
      coin.style.transform = `translate(${dx}px, ${dy}px) scale(.4) rotate(360deg)`;
      coin.style.opacity = '0';
    });
    setTimeout(() => coin.remove(), 1000);
  }
}

function earn(n, x, y) {
  if (n <= 0) return;
  const season = getActiveSeason();
  const boosted = season ? Math.round(n * season.bonus) : n;
  flyCoinsToPill(boosted, x ?? innerWidth / 2, y ?? innerHeight / 2);
  setTimeout(() => {
    Player.add(boosted);
    Level.addXP(Math.min(boosted, 20));
    updateQuestProgress('coins_earned', boosted);
    updateQuestProgress('xp_earned', Math.min(boosted, 20));
    Settings.vibrate(10);
    checkAchievements();
  }, 500);
}

function particleBurst(x, y, count = 10, emoji = '✨') {
  if (!Settings.animations) return;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'burst-particle'; p.textContent = emoji;
    p.style.left = x + 'px'; p.style.top = y + 'px';
    document.body.appendChild(p);
    const a = Math.random() * Math.PI * 2;
    const s = 40 + Math.random() * 80;
    const dx = Math.cos(a) * s, dy = Math.sin(a) * s - 30;
    requestAnimationFrame(() => {
      p.style.transition = 'transform .7s cubic-bezier(.2,.8,.3,1), opacity .7s';
      p.style.transform = `translate(${dx}px, ${dy}px) scale(0) rotate(${Math.random() * 360}deg)`;
      p.style.opacity = '0';
    });
    setTimeout(() => p.remove(), 800);
  }
}

function confetti(count = 30) {
  if (!Settings.animations) return;
  const colors = ['#6c5ce7','#fd79a8','#00cec9','#fdcb6e','#ff6b6b','#ffd700'];
  for (let i = 0; i < count; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.left = (Math.random() * innerWidth) + 'px';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    document.body.appendChild(c);
    const dur = 1500 + Math.random() * 1500;
    const rot = (Math.random() - 0.5) * 720;
    const dx = (Math.random() - 0.5) * 200;
    requestAnimationFrame(() => {
      c.style.transition = `transform ${dur}ms ease-in, opacity ${dur}ms ease-in`;
      c.style.transform = `translate(${dx}px, ${innerHeight + 40}px) rotate(${rot}deg)`;
      c.style.opacity = '0.8';
    });
    setTimeout(() => c.remove(), dur + 100);
  }
}

function getStars(gameId) {
  const best = Stats.get(gameId).best || 0;
  if (best >= 500) return 3;
  if (best >= 200) return 2;
  if (best >= 50) return 1;
  return 0;
}

function renderGameCard(g, i) {
  const stars = getStars(g.id);
  const locked = !isGameUnlocked(g);
  const lockReason = locked ? getLockReason(g) : null;
  
  let badgeHTML = '';
  if (g.badge === 'hot') badgeHTML = '<div class="card-badge hot">🔥 HOT</div>';
  else if (g.badge === 'farm') badgeHTML = '<div class="card-badge farm">🌱</div>';
  else if (g.badge === 'cook') badgeHTML = '<div class="card-badge cook">🍳</div>';
  else if (g.badge === 'event') badgeHTML = '<div class="card-badge event">🎊 EVENT</div>';
  else badgeHTML = '<div class="card-badge play">PLAY</div>';
  
  if (locked && g.levelLocked) {
    badgeHTML = `<div class="card-badge lock-badge">🔒 Lv ${g.levelLocked}</div>`;
  }
  
  return `<div class="game-card ${locked ? 'locked' : ''}" style="animation-delay:${i * 0.03}s" onclick="handleGameClick('${g.id}')">
    <div class="card-bg" style="background:${g.color}">${g.icon}</div>
    <div class="card-overlay"></div>
    ${badgeHTML}
    ${stars && !locked ? `<div class="card-stars">${'⭐'.repeat(stars)}</div>` : ''}
    ${locked ? `<div class="card-lock-info">${lockReason}</div>` : ''}
    <div class="card-content"><h3>${g.name}</h3><p>${g.tagline}</p></div>
  </div>`;
}

function handleGameClick(id) {
  const g = FEATURED.find(x => x.id === id);
  if (!g) return;
  if (!isGameUnlocked(g)) {
    const reason = getLockReason(g);
    Sound.wrong();
    showModal('🔒', 'Locked!', reason, 'OK', null);
    return;
  }
  openGame(id);
}

function renderFeatured(filter = '') {
  const grid = document.getElementById('featuredGrid');
  let list = FEATURED;
  if (filter) {
    const q = filter.toLowerCase();
    list = list.filter(g => g.name.toLowerCase().includes(q) || g.tagline.toLowerCase().includes(q));
  }
  if (list.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-dim);padding:30px;font-size:12px">No games found</div>';
    return;
  }
  grid.innerHTML = list.map((g, i) => renderGameCard(g, i)).join('');
  document.getElementById('playableCount').textContent = `${FEATURED.length} games`;
}

function renderFarmCook() {
  const grid = document.getElementById('farmCookGrid');
  const list = FEATURED.filter(g => FARM_COOK_IDS.includes(g.id));
  grid.innerHTML = list.map((g, i) => renderGameCard(g, i)).join('');

function renderChips() {

    { id: 'all', icon: '✨', label: 'All' },

    { id: 'cooking', icon: '🍳', label: 'Cooking' },

function setChip(el, id) {

let gameCleanup = null;
function openGame(id) {
  Sound.click(); Settings.vibrate(10);
  const g = FEATURED.find(x => x.id === id);
  if (!g) return;
  const played = Storage.get('playedGames', []);
  if (!played.includes(id)) { played.push(id); Storage.set('playedGames', played); }
  Stats.incr(id, 'plays');
  updateQuestProgress(id + '_plays');
  updateQuestProgress('games_played');
  if (g.cat === 'farming') updateQuestProgress('farm_played');
  if (g.cat === 'cooking') updateQuestProgress('cook_played');
  checkAchievements();
  const boost = Storage.get('xpBoost', false);
  if (boost) Storage.set('xpBoost', false);
  document.getElementById('gameTitle').textContent = g.name;
  document.getElementById('gameStats').innerHTML = '';
  const body = document.getElementById('gameBody');
  body.innerHTML = '';
  document.getElementById('gameScreen').classList.add('active');
  requestAnimationFrame(() => {
    const api = {
      body,
      setStats: (html) => document.getElementById('gameStats').innerHTML = html,
      earn: (n, x, y) => earn(boost ? n * 2 : n, x, y),
      toast: showToast, showModal, confetti, sound: Sound, xpBoost: boost,
    };
    const engine = GAME_ENGINES[id];
    if (engine) gameCleanup = engine(api);
  });
}

function closeGame() {
  if (gameCleanup) { try { gameCleanup(); } catch(e) {} gameCleanup = null; }
  document.getElementById('gameScreen').classList.remove('active');
  document.getElementById('gameBody').innerHTML = '';
  renderFeatured(); renderFarmCook();
  renderDaily(); renderGift(); renderEvent(); renderLevelBanner();
  renderQuests(); renderLbPreview(); checkAchievements();
}

/* 1. Subway Girl */
function SubwayGirl({ body, setStats, earn, toast, showModal, sound }) {
  body.innerHTML = '<canvas id="swCanvas"></canvas>';
  const canvas = document.getElementById('swCanvas'), ctx = canvas.getContext('2d');
  let W, H; const DPR = window.devicePixelRatio || 1;
  function resize() { W = canvas.width = canvas.clientWidth * DPR; H = canvas.height = canvas.clientHeight * DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  resize(); window.addEventListener('resize', resize);
  const LANES = [0.28, 0.5, 0.72];
  let player = { lane: 1, x: 0, y: 0, jumping: false, jumpV: 0 };
  let speed = 5, distance = 0, score = 0, gameOver = false;
  let obstacles = [], coins = [], spawnTimer = 0;
  let shieldActive = false, magnetActive = false, shieldTimer = 0, magnetTimer = 0;
  const dW = () => W/DPR, dH = () => H/DPR;
  player.x = LANES[1] * dW();
  function onDown(e) { const p = e.touches ? e.touches[0] : e; p._sx = p.clientX; p._sy = p.clientY; }
  function onUp(e) { if (gameOver) return;
    const p = e.changedTouches ? e.changedTouches[0] : e;
    const dx = p.clientX - p._sx, dy = p.clientY - p._sy;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 20) {
      if (dx > 0) player.lane = Math.min(2, player.lane+1); else player.lane = Math.max(0, player.lane-1);
      sound.jump();
    } else if (dy < -30 && !player.jumping) { player.jumping = true; player.jumpV = -9; sound.jump(); }
  }
  canvas.addEventListener('touchstart', onDown, { passive: true });
  canvas.addEventListener('touchend', onUp, { passive: true });
  canvas.addEventListener('mousedown', onDown); canvas.addEventListener('mouseup', onUp);
  window._swShield = () => { if (shieldActive) return; if (!Player.spend(30)) { toast('🪙 Need 30'); return; } shieldActive = true; shieldTimer = 8000; };
  window._swMagnet = () => { if (magnetActive) return; if (!Player.spend(50)) { toast('🪙 Need 50'); return; } magnetActive = true; magnetTimer = 8000; };
  function spawn() {
    const lane = Math.floor(Math.random() * 3);
    obstacles.push({ lane, y: -80 });
    if (Math.random() < 0.6) {
      const cLane = Math.floor(Math.random() * 3);
      for (let i = 0; i < 4; i++) coins.push({ lane: cLane, y: -140 - i * 55 });
    }
  }
  let lastT = performance.now(), animId;
  function loop(now) {
    animId = requestAnimationFrame(loop);
    const dt = Math.min((now - lastT) / 16.67, 3); lastT = now;
    if (gameOver) return;
    const w = dW(), h = dH();
    player.x += (LANES[player.lane] * w - player.x) * 0.22;
    if (player.jumping) { player.jumpV += 0.55 * dt; player.y += player.jumpV * dt; if (player.y >= 0) { player.y = 0; player.jumping = false; player.jumpV = 0; } }
    if (shieldTimer > 0) { shieldTimer -= 16 * dt; if (shieldTimer <= 0) shieldActive = false; }
    if (magnetTimer > 0) { magnetTimer -= 16 * dt; if (magnetTimer <= 0) magnetActive = false; }
    distance += speed * dt; speed = 5 + Math.min(distance/400, 8); score = Math.floor(distance/10);
    spawnTimer += dt;
    if (spawnTimer > Math.max(28 - speed, 15)) { spawn(); spawnTimer = 0; }
    for (let i = obstacles.length-1; i >= 0; i--) { obstacles[i].y += speed*dt; if (obstacles[i].y > h+120) obstacles.splice(i,1); }
    for (let i = coins.length-1; i >= 0; i--) { coins[i].y += speed*dt; if (coins[i].y > h+60) coins.splice(i,1); }
    const py = h - 100 + player.y;
    coins.forEach(c => {
      const cx = LANES[c.lane] * w;
      const dxp = cx - player.x, dyp = c.y - (py - 30);
      if (magnetActive && Math.sqrt(dxp*dxp + dyp*dyp) < 140) { c.y -= (c.y - (py-30)) * 0.15; c.lane = player.lane; }
      if (Math.abs(dxp) < 30 && Math.abs(dyp) < 40) { c._taken = true; score += 3; sound.pop(); }
    });
    coins = coins.filter(c => !c._taken);
    for (const o of obstacles) {
      const ox = LANES[o.lane] * w;
      if (Math.abs(ox - player.x) < 40 && o.y > py - 70 && o.y < py + 20) {
        if (shieldActive) { shieldActive = false; shieldTimer = 0; o._gone = true; }
        else { gameOver = true; sound.lose();
          const coinsEarned = Math.floor(score/10) + 5;
          earn(coinsEarned, w/2, h/2); Stats.update('subway-girl', 'best', score);
          const best = Stats.get('subway-girl').best || 0;
          setTimeout(() => showModal('💥', 'Crashed!', `Score: ${score}<br>Best: ${best}<br>+🪙 ${coinsEarned}`, 'Play Again', () => { closeGame(); setTimeout(() => openGame('subway-girl'), 200); }), 400);
          return; } } }
    obstacles = obstacles.filter(o => !o._gone);
    ctx.clearRect(0, 0, w, h);
    const sky = ctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, '#1a1f3d'); sky.addColorStop(0.5, '#4facfe'); sky.addColorStop(1, '#00f2fe');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, w, h);
    const trackTop = h * 0.18;
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.moveTo(w*0.05, h); ctx.lineTo(w*0.45, trackTop); ctx.lineTo(w*0.55, trackTop); ctx.lineTo(w*0.95, h); ctx.closePath(); ctx.fill();
    const offset = (distance * 3) % 80;
    ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 2;
    for (let i = 0; i < 15; i++) {
      const t1 = (i*80 + offset)/400, t2 = (i*80 + offset + 40)/400;
      if (t1 > 1 || t2 > 1) continue;
      [0.28, 0.5, 0.72].forEach(lx => {
        const sc = 1 + t1*3, sc2 = 1 + t2*3;
        ctx.beginPath();
        ctx.moveTo(w*0.5 + (lx-0.5)*w*sc, h - t1*(h-trackTop));
        ctx.lineTo(w*0.5 + (lx-0.5)*w*sc2, h - t2*(h-trackTop));
        ctx.stroke(); }); }
    obstacles.forEach(o => { const px = LANES[o.lane]*w; const sz = 55*(0.5+o.y/h*0.7);
      ctx.font = `${sz}px sans-serif`; ctx.textAlign = 'center'; ctx.fillText('🚧', px, o.y); });
    coins.forEach(c => { const px = LANES[c.lane]*w; const sz = 20*(0.5+c.y/h*0.7);
      ctx.font = `${sz*1.6}px sans-serif`; ctx.textAlign = 'center'; ctx.fillText('🪙', px, c.y); });
    ctx.save();
    ctx.globalAlpha = 0.3;
    ctx.beginPath(); ctx.ellipse(player.x, py+8, 20, 6, 0, 0, Math.PI*2); ctx.fillStyle = '#000'; ctx.fill();
    ctx.globalAlpha = 1;
    ctx.font = '54px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🏃‍♀️', player.x, py);
    if (shieldActive) { ctx.strokeStyle = 'rgba(0,206,201,.8)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(player.x, py-20, 40, 0, Math.PI*2); ctx.stroke(); }
    ctx.restore();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 15px system-ui'; ctx.textAlign = 'left';
    ctx.fillText(`Score: ${score}`, 14, 26);
    setStats(`<div class="game-stat">🎯 ${score}</div><div class="game-stat" onclick="window._swShield()" style="cursor:pointer">🛡️ 30</div><div class="game-stat" onclick="window._swMagnet()" style="cursor:pointer">🧲 50</div>`);
  }
  animId = requestAnimationFrame(loop);
  return () => { cancelAnimationFrame(animId); window.removeEventListener('resize', resize); delete window._swShield; delete window._swMagnet; };
}

/* 4. Miss Dragon */
function MissDragon({ body, setStats, earn, toast, sound, showModal }) {
  const SIZE = 8;
  const GEMS = [{e:'🔴',c:'#ff6b6b'},{e:'🟡',c:'#fdcb6e'},{e:'🟢',c:'#00b894'},{e:'🔵',c:'#0984e3'},{e:'🟣',c:'#a29bfe'},{e:'🟠',c:'#e17055'}];
  let board = [], selected = null, score = 0, moves = 25, busy = false;
  const rand = () => Math.floor(Math.random()*GEMS.length);
  function newBoard() { board = Array.from({ length: SIZE }, () => Array.from({ length: SIZE }, () => rand()));
    for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) { let t = 0; while (hasMatch(x,y) && t++ < 20) board[y][x] = rand(); } }
  function hasMatch(x, y) { const v = board[y][x]; let h = 1, vv = 1;
    for (let i = x-1; i >= 0 && board[y][i] === v; i--) h++;
    for (let i = x+1; i < SIZE && board[y][i] === v; i++) h++;
    for (let i = y-1; i >= 0 && board[i][x] === v; i--) vv++;
    for (let i = y+1; i < SIZE && board[i][x] === v; i++) vv++;
    return h >= 3 || vv >= 3; }
  function findMatches() { const m = new Set();
    for (let y = 0; y < SIZE; y++) { let run = 1;
      for (let x = 1; x <= SIZE; x++) {
        if (x < SIZE && board[y][x] !== null && board[y][x] === board[y][x-1]) run++;
        else { if (run >= 3) for (let i = x-run; i < x; i++) m.add(`${i},${y}`); run = 1; } } }
    for (let x = 0; x < SIZE; x++) { let run = 1;
      for (let y = 1; y <= SIZE; y++) {
        if (y < SIZE && board[y][x] !== null && board[y][x] === board[y-1][x]) run++;
        else { if (run >= 3) for (let i = y-run; i < y; i++) m.add(`${x},${i}`); run = 1; } } }
    return m; }
  function gravity() { for (let x = 0; x < SIZE; x++) { let w = SIZE-1;
    for (let y = SIZE-1; y >= 0; y--) if (board[y][x] !== null) { if (w !== y) { board[w][x] = board[y][x]; board[y][x] = null; } w--; }
    for (let y = w; y >= 0; y--) board[y][x] = rand(); } }
  async function resolve() { busy = true; let combo = 0;
    while (true) { const m = findMatches(); if (m.size === 0) break;
      combo++; score += m.size * 10 * combo;
      m.forEach(k => { const [x,y] = k.split(',').map(Number);
        const el = document.querySelector(`[data-x="${x}"][data-y="${y}"]`); if (el) el.classList.add('pop'); });
      sound.pop(); await new Promise(r => setTimeout(r, 220));
      m.forEach(k => { const [x,y] = k.split(',').map(Number); board[y][x] = null; });
      gravity(); render(); await new Promise(r => setTimeout(r, 130)); }
    if (combo > 0) earn(combo);
    Stats.update('miss-dragon', 'best', score); busy = false;
    if (moves <= 0) { const coins = Math.floor(score/20) + 5;
      earn(coins); sound.win(); confetti(25);
      setTimeout(() => showModal('🐉', 'Dragon Defeated!', `Score: ${score}<br>+🪙 ${coins}`, 'Play Again', () => { closeGame(); setTimeout(() => openGame('miss-dragon'), 200); }), 400); } }
  function render() { let html = '<div class="dragon-board">';
    for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
      const v = board[y][x]; const g = v !== null ? GEMS[v] : { e: '', c: 'transparent' };
      const sel = selected && selected.x === x && selected.y === y ? 'selected' : '';
      html += `<div class="dragon-cell ${sel}" data-x="${x}" data-y="${y}" style="background:${g.c}" onclick="window._dragonTap(${x},${y})">${g.e}</div>`; }
    html += '</div>';
    document.getElementById('dragonBoardWrap').innerHTML = html;
    setStats(`<div class="game-stat">⭐ ${score}</div><div class="game-stat">🎯 ${moves}</div>`); }
  function tap(x, y) { if (busy || moves <= 0) return;
    if (!selected) { selected = { x, y }; render(); return; }
    if (selected.x === x && selected.y === y) { selected = null; render(); return; }
    const dx = Math.abs(selected.x - x), dy = Math.abs(selected.y - y);
    if (dx + dy === 1) {
      [board[y][x], board[selected.y][selected.x]] = [board[selected.y][selected.x], board[y][x]];
      if (findMatches().size === 0) { [board[y][x], board[selected.y][selected.x]] = [board[selected.y][selected.x], board[y][x]];
        toast('❌ No match'); selected = null; render(); return; }
      moves--; selected = null; render(); sound.click(); resolve();
    } else { selected = { x, y }; render(); } }
  window._dragonTap = tap;
  body.innerHTML = `<div class="dragon-wrap">
    <div class="dragon-top"><div class="dragon-badge">🐉 Match 3+</div></div>
    <div id="dragonBoardWrap"></div></div>`;
  newBoard(); render();
  return () => { delete window._dragonTap; };
}

    }
    html += '</div></div>'; body.innerHTML = html;
    setStats(`<div class="game-stat">🫧 ${score}</div>`); }
  function tap(x, y) { const v = grid[y][x]; if (v === -1) return;
    const group = [], seen = new Set(); const stack = [[x, y]];
    while (stack.length) { const [cx, cy] = stack.pop(); const key = cx + ',' + cy;
      if (seen.has(key)) continue; if (cx < 0 || cx >= COLS || cy < 0 || cy >= ROWS) continue;
      if (grid[cy][cx] !== v) continue; seen.add(key); group.push([cx, cy]);
      stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]); }
    if (group.length < 2) { sound.wrong(); return; }
    group.forEach(([gx, gy]) => grid[gy][gx] = -1);
    score += group.length * group.length; sound.pop();
    if (score - lastAwarded >= 100) { const chunks = Math.floor((score-lastAwarded)/100); lastAwarded += chunks*100; earn(chunks*2); }
    for (let cx = 0; cx < COLS; cx++) { const col = [];
      for (let cy = ROWS-1; cy >= 0; cy--) if (grid[cy][cx] !== -1) col.push(grid[cy][cx]);
      for (let cy = ROWS-1, i = 0; cy >= 0; cy--, i++) grid[cy][cx] = i < col.length ? col[i] : -1; }
    Stats.update('bubble-pop', 'best', score); render(); }
  window._bubbleTap = tap;
  newGrid(); render();
  return () => { delete window._bubbleTap; };
}

      setStats(`<div class="game-stat">🏆 ${wins}</div>`);
      setTimeout(() => { locked = false; }, 800);
    }, 200);
  }
  window._rpsPlay = play;
  render();
  return () => { delete window._rpsPlay; delete window._rpsMode; delete window._mpPlay; delete window._mpReset; };
}

/* 10. Memory Flip */
function MemoryFlip({ body, setStats, earn, toast, sound, showModal }) {
  const EMOJIS = ['🐶','🐱','🦊','🐼','🦁','🐸','🐵','🦄'];
  let cards = [], flipped = [], matched = 0, moves = 0, locked = false;
  function init() { cards = [...EMOJIS, ...EMOJIS].sort(() => Math.random() - 0.5).map(e => ({ emoji: e, revealed: false, matched: false }));
    flipped = []; matched = 0; moves = 0; locked = false; render(); }
  function render() {
    body.innerHTML = `<div style="padding:10px;height:100%;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700">
        <div>👣 Moves: ${moves}</div><div>✅ Pairs: ${matched}/${EMOJIS.length}</div></div>
      <div style="flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-content:center" id="memGrid"></div>
    </div>`;
    document.getElementById('memGrid').innerHTML = cards.map((c, i) => `
      <div onclick="window._memTap(${i})" style="aspect-ratio:1;border-radius:14px;cursor:pointer;display:grid;place-items:center;font-size:30px;transition:all .3s;background:${c.matched ? 'linear-gradient(135deg,#00cec9,#00b894)' : c.revealed ? 'rgba(255,255,255,.15)' : 'linear-gradient(135deg,var(--accent),var(--accent2))'};${c.matched ? 'opacity:.5' : ''}${c.revealed || c.matched ? '' : 'color:transparent'}">${c.revealed || c.matched ? c.emoji : '❔'}</div>
    `).join('');
    setStats(`<div class="game-stat">👣 ${moves}</div>`); }
  function tap(i) { if (locked) return; const c = cards[i];
    if (c.revealed || c.matched) return;
    c.revealed = true; flipped.push(i); sound.click(); render();
    if (flipped.length === 2) { moves++; locked = true;
      const [a, b] = flipped;
      if (cards[a].emoji === cards[b].emoji) { cards[a].matched = cards[b].matched = true; matched++; sound.correct();
        flipped = []; locked = false; render();
        if (matched === EMOJIS.length) { const coins = Math.max(5, 30 - moves);
          earn(coins); sound.win(); confetti(30); Stats.update('memory-flip', 'best', 100 - moves);
          setTimeout(() => showModal('🧠', 'Perfect!', `Completed in ${moves} moves<br>+🪙 ${coins}`, 'Play Again', () => { closeGame(); setTimeout(() => openGame('memory-flip'), 200); }), 400); }
      } else { sound.wrong();
        setTimeout(() => { cards[a].revealed = cards[b].revealed = false; flipped = []; locked = false; render(); }, 800); } } }
  window._memTap = tap;
  init();
  return () => { delete window._memTap; };
}

  window._chickenTap = (id) => { const c = chickens.find(x => x.id === id);
    if (!c || !c.ready) { if (c) sound.wrong(); return; }
    c.ready = false; c.progress = 0;
    eggs++; earned += 5; Stats.update('chicken-coop', 'eggs', eggs);
    sound.correct(); earn(5); render(); };
  window._buyChicken = () => { if (!Player.spend(50)) { toast('🪙 Need 50'); return; }
    const names = ['Daisy','Penny','Nugget','Clucky'];
    chickens.push({ id: Date.now(), emoji: '🐔', name: names[Math.floor(Math.random()*names.length)], progress: 0, ready: false, speed: 2000 + Math.random()*3000 });
    toast('🐔 New hen!'); render(); };
  window._feedAll = () => { if (!Player.spend(15)) { toast('🪙 Need 15'); return; }
    chickens.forEach(c => { c.progress = Math.min(1, c.progress + 0.5); if (c.progress >= 1) c.ready = true; });
    toast('🌾 Hens happy!'); render(); };
  tickInt = setInterval(() => { let changed = false;
    chickens.forEach(c => { if (!c.ready) { c.progress += 100 / c.speed; if (c.progress >= 1) { c.progress = 1; c.ready = true; changed = true; } } });
    if (changed) render(); }, 200);
  render();
  return () => { clearInterval(tickInt); delete window._chickenTap; delete window._buyChicken; delete window._feedAll; };
}

function BeeGarden({ body, setStats, earn, toast, sound, showModal }) {
  let flowers = [], bee = { x: 50, y: 50 }, pollinated = 0, earned = 0, timeLeft = 45;
  let pollinateInt;
  function spawnFlower() { if (flowers.length >= 8) return;
    const colors = ['#ff6b6b','#fdcb6e','#f093fb','#a29bfe','#00cec9'];
    flowers.push({ id: Date.now() + Math.random(), x: 15 + Math.random()*70, y: 20 + Math.random()*60,
      color: colors[Math.floor(Math.random()*colors.length)], emoji: '🌸' }); }
  function render() {
    body.innerHTML = `<div style="padding:10px;height:100%;display:flex;flex-direction:column;gap:6px">
      <div class="farm-stats">
        <div class="farm-stat"><div class="farm-stat-label">POLLINATED</div><div class="farm-stat-val">${pollinated}</div></div>
        <div class="farm-stat"><div class="farm-stat-label">EARNED</div><div class="farm-stat-val">🪙${earned}</div></div>
        <div class="farm-stat"><div class="farm-stat-label">TIME</div><div class="farm-stat-val">${timeLeft}s</div></div>
      </div>
      <div id="garden" style="flex:1;position:relative;background:linear-gradient(180deg,#0a2b15,#0a1a0e);border-radius:16px;overflow:hidden;border:2px solid rgba(255,255,255,.08);touch-action:none">
        ${flowers.map(f => `<div style="position:absolute;left:${f.x}%;top:${f.y}%;font-size:32px;transform:translate(-50%,-50%)">${f.emoji}</div>`).join('')}
        <div id="bee" style="position:absolute;left:${bee.x}%;top:${bee.y}%;font-size:36px;transform:translate(-50%,-50%);pointer-events:none">🐝</div>
      </div>
    </div>`;
    setStats(`<div class="game-stat">🐝 ${pollinated}</div>`);
    attachEvents(); }
  function attachEvents() { const garden = document.getElementById('garden');
    function moveTo(clientX, clientY) { const rect = garden.getBoundingClientRect();
      bee.x = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
      bee.y = Math.max(0, Math.min(100, ((clientY - rect.top) / rect.height) * 100));
      const el = document.getElementById('bee'); if (el) { el.style.left = bee.x + '%'; el.style.top = bee.y + '%'; }
      checkPollinate(); }
    garden.onmousemove = (e) => moveTo(e.clientX, e.clientY);
    garden.ontouchmove = (e) => { e.preventDefault(); if (e.touches[0]) moveTo(e.touches[0].clientX, e.touches[0].clientY); };
    garden.ontouchstart = (e) => { if (e.touches[0]) moveTo(e.touches[0].clientX, e.touches[0].clientY); }; }
  function checkPollinate() { for (let i = flowers.length - 1; i >= 0; i--) { const f = flowers[i];
    const dx = f.x - bee.x, dy = f.y - bee.y;
    if (Math.sqrt(dx*dx + dy*dy) < 8) { pollinated++; earned += 3;
      Stats.update('bee-garden', 'flowers', pollinated);
      sound.pop(); if (pollinated % 3 === 0) earn(3);
      flowers.splice(i, 1); render(); return; } } }
  pollinateInt = setInterval(() => { spawnFlower(); render(); }, 1200);
  const timerInt = setInterval(() => { timeLeft--; setStats(`<div class="game-stat">🐝 ${pollinated}</div><div class="game-stat">⏱️ ${timeLeft}s</div>`);
    if (timeLeft <= 0) { clearInterval(pollinateInt); clearInterval(timerInt);
      const coins = pollinated + 5; earn(coins); sound.win(); confetti(30);
      setTimeout(() => showModal('🐝', 'Done!', `Pollinated ${pollinated}<br>+🪙 ${coins}`, 'Play Again', () => { closeGame(); setTimeout(() => openGame('bee-garden'), 200); }), 400); } }, 1000);
  for (let i = 0; i < 4; i++) spawnFlower();
  render();
  return () => { clearInterval(pollinateInt); clearInterval(timerInt); };
}

function IceCreamRush({ body, setStats, earn, toast, sound, showModal }) {
  const ORDERS = [
    { name: 'Vanilla', color: '#f5f0e6', emoji: '🍦', pay: 5 },
    { name: 'Strawberry', color: '#ff9bc9', emoji: '🍓', pay: 7 },
    { name: 'Chocolate', color: '#6b4423', emoji: '🍫', pay: 7 },
    { name: 'Mint', color: '#7dd456', emoji: '🌿', pay: 8 },
    { name: 'Blueberry', color: '#7b9cff', emoji: '🫐', pay: 8 },
    { name: 'Mango', color: '#fdcb6e', emoji: '🥭', pay: 9 },
  ];
  let served = 0, order = null, built = [], timeLeft = 30, playing = true;
  function newOrder() { order = ORDERS[Math.floor(Math.random() * ORDERS.length)];
    const layers = 2 + Math.floor(Math.random() * 3);
    order.stack = Array.from({ length: layers }, () => ORDERS[Math.floor(Math.random() * ORDERS.length)]);
    built = []; timeLeft = 30; render(); }
  function pick(idx) { if (!playing) return;
    const picked = ORDERS[idx]; const expected = order.stack[built.length];
    if (picked.name === expected.name) { built.push(picked); sound.pop();
      if (built.length === order.stack.length) { served++;
        const reward = order.pay + (timeLeft > 15 ? 3 : 0);
        Stats.update('ice-cream-rush', 'served', served);
        earn(reward); toast(`🍦 Perfect! +🪙${reward}`);
        sound.correct(); setTimeout(newOrder, 500);
      } else render();
    } else { sound.wrong(); toast('❌ Wrong!'); timeLeft = Math.max(2, timeLeft - 3); render(); } }
  window._icePick = pick;
  function render() {
    body.innerHTML = `<div style="padding:10px;height:100%;display:flex;flex-direction:column;gap:10px">
      <div class="coo-order"><div class="coo-order-label">CUSTOMER WANTS</div>
        <div class="coo-order-name">🍦 ${order.stack.length} layers</div>
        <div class="coo-order-reward">🪙 ${order.pay} + bonus</div>
        <div class="coo-steps">${order.stack.map((s, i) => `<div class="coo-step ${i < built.length ? 'done' : ''} ${i === built.length ? 'current' : ''}">${s.emoji}</div>`).join('')}</div>
        <div style="margin-top:8px;height:4px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden">
          <div style="height:100%;width:${(timeLeft/30)*100}%;transition:width 1s linear;background:${timeLeft<8?'linear-gradient(90deg,#ff6b6b,#ee5a6f)':'linear-gradient(90deg,#00cec9,#00b894)'}"></div>
        </div>
      </div>
      <div style="flex:1;background:rgba(255,255,255,.04);border-radius:14px;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-end;padding:12px;gap:3px;min-height:0">
        ${built.length === 0 ? '<div style="color:var(--text-dim);font-size:12px;margin:auto"><div style="font-size:40px;text-align:center">🍦</div></div>'
          : built.map(b => `<div style="width:70%;height:22px;background:${b.color};border-radius:50% 50% 8px 8px;box-shadow:inset 0 -3px 6px rgba(0,0,0,.2)"></div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px">
        ${ORDERS.map((o, i) => `<div onclick="window._icePick(${i})" style="background:${o.color};border-radius:12px;padding:10px;text-align:center;cursor:pointer;border:2px solid rgba(255,255,255,.15)">
          <div style="font-size:22px">${o.emoji}</div>
          <div style="font-size:9.5px;font-weight:700;color:#0a0e27">${o.name}</div>
        </div>`).join('')}
      </div>
    </div>`;
    setStats(`<div class="game-stat">🍦 ${served}</div><div class="game-stat">⏱️ ${timeLeft}s</div>`); }
  const timerInt = setInterval(() => { if (!playing) return; timeLeft--;
    if (timeLeft <= 0) { timeLeft = 30; built = []; toast('⏰ New order'); sound.wrong(); }
    render(); }, 1000);
  const totalTimer = setTimeout(() => { playing = false; clearInterval(timerInt);
    const coins = Math.floor(served * 1.5) + 5;
    earn(coins); sound.win(); confetti(30);
    showModal('🍦', 'Closed!', `Served ${served}<br>+🪙 ${coins}`, 'Play Again', () => { closeGame(); setTimeout(() => openGame('ice-cream-rush'), 200); }); }, 90000);
  newOrder();
  return () => { clearInterval(timerInt); clearTimeout(totalTimer); delete window._icePick; };
}

function PizzaMaster({ body, setStats, earn, toast, sound, showModal }) {
  const TOPPINGS = [
    { emoji: '🍅', name: 'Tomato', color: '#e74c3c' },
    { emoji: '🧀', name: 'Cheese', color: '#fdcb6e' },
    { emoji: '🥓', name: 'Bacon', color: '#e17055' },
    { emoji: '🍄', name: 'Mushroom', color: '#a29bfe' },
    { emoji: '🫒', name: 'Olive', color: '#2d3436' },
    { emoji: '🌶️', name: 'Pepper', color: '#ff6b6b' },
  ];
  let pizzas = 0, current = null, placed = [], timeLeft = 25, playing = true;
  function newPizza() { const numToppings = 3 + Math.floor(Math.random() * 2);
    const shuffled = [...TOPPINGS].sort(() => Math.random() - 0.5);
    current = { toppings: shuffled.slice(0, numToppings), reward: 8 + numToppings * 2 };
    placed = []; timeLeft = 25; render(); }
  function placeTop(emoji) { if (!playing) return;
    const needed = current.toppings.find(t => !placed.includes(t.emoji));
    if (needed && needed.emoji === emoji) { placed.push(emoji); sound.sizzle();
      if (placed.length === current.toppings.length) { pizzas++;
        const reward = current.reward + (timeLeft > 12 ? 5 : 0);
        Stats.update('pizza-master', 'pizzas', pizzas);
        earn(reward); toast(`🍕 Perfect! +🪙${reward}`);
        sound.correct(); confetti(10); setTimeout(newPizza, 500);
      } else render();
    } else { sound.wrong(); toast('❌ Wrong!'); timeLeft = Math.max(2, timeLeft - 3); render(); } }
  window._pizzaTop = placeTop;
  function render() {
    body.innerHTML = `<div style="padding:10px;height:100%;display:flex;flex-direction:column;gap:10px">
      <div class="coo-order"><div class="coo-order-label">ORDER</div>
        <div class="coo-order-name">🍕 Pizza #${pizzas + 1}</div>
        <div class="coo-order-reward">🪙 ${current.reward} + bonus</div>
        <div class="coo-steps">${current.toppings.map(t => {
          const isPlaced = placed.includes(t.emoji);
          const next = !isPlaced && current.toppings.findIndex(x => !placed.includes(x.emoji)) === current.toppings.indexOf(t);
          return `<div class="coo-step ${isPlaced ? 'done' : ''} ${next ? 'current' : ''}">${t.emoji}</div>`;
        }).join('')}</div>
        <div style="margin-top:8px;height:4px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden">
          <div style="height:100%;width:${(timeLeft/25)*100}%;transition:width 1s linear;background:${timeLeft<8?'linear-gradient(90deg,#ff6b6b,#ee5a6f)':'linear-gradient(90deg,#00cec9,#00b894)'}"></div>
        </div>
      </div>
      <div style="flex:1;background:rgba(255,255,255,.04);border-radius:14px;display:grid;place-items:center;min-height:0;padding:12px">
        <div style="width:70%;aspect-ratio:1;max-width:220px;border-radius:50%;background:radial-gradient(circle, #ffd45e 0%, #f0a92a 100%);position:relative">
          <div style="position:absolute;inset:12%;border-radius:50%;background:radial-gradient(circle, #e74c3c 0%, #c0392b 100%)"></div>
          ${placed.map((emoji, i) => { const angle = (i / Math.max(placed.length, 3)) * Math.PI * 2;
            const r = 25; const x = 50 + Math.cos(angle) * r; const y = 50 + Math.sin(angle) * r;
            return `<div style="position:absolute;left:${x}%;top:${y}%;transform:translate(-50%,-50%);font-size:24px">${emoji}</div>`; }).join('')}
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px">
        ${TOPPINGS.map(t => `<div onclick="window._pizzaTop('${t.emoji}')" style="background:${t.color};border-radius:12px;padding:10px;text-align:center;cursor:pointer;border:2px solid rgba(255,255,255,.15)">
          <div style="font-size:22px">${t.emoji}</div>
          <div style="font-size:9.5px;font-weight:700;color:#fff">${t.name}</div>
        </div>`).join('')}
      </div>
    </div>`;
    setStats(`<div class="game-stat">🍕 ${pizzas}</div><div class="game-stat">⏱️ ${timeLeft}s</div>`); }
  const timerInt = setInterval(() => { if (!playing) return; timeLeft--;
    if (timeLeft <= 0) { timeLeft = 25; placed = []; toast('⏰ New order'); sound.wrong(); }
    render(); }, 1000);
  const totalTimer = setTimeout(() => { playing = false; clearInterval(timerInt);
    const coins = Math.floor(pizzas * 2) + 10;
    earn(coins); sound.win(); confetti(30);
    showModal('🍕', 'Oven Off!', `Made ${pizzas} pizzas<br>+🪙 ${coins}`, 'Play Again', () => { closeGame(); setTimeout(() => openGame('pizza-master'), 200); }); }, 90000);
  newPizza();
  return () => { clearInterval(timerInt); clearTimeout(totalTimer); delete window._pizzaTop; };
}

function EasterHunt({ body, setStats, earn, toast, sound, showModal }) {
  let eggs = 0, timeLeft = 30, activeHole = -1, interval, timerInt, playing = true;
  function render() { body.innerHTML = `<div style="padding:10px;height:100%;display:flex;flex-direction:column;gap:6px">
      <div style="text-align:center;font-size:10.5px;color:var(--text-dim)">Find the hidden eggs 🐰</div>
      <div style="flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:center">
        ${Array.from({length:9},(_,i) => `<div data-i="${i}" onclick="window._eggsTap(${i})" style="aspect-ratio:1;border-radius:16px;background:linear-gradient(180deg,#2a4a2a,#1a2a1a);border:3px solid rgba(255,255,255,.1);display:grid;place-items:center;cursor:pointer;overflow:hidden">
          <div class="egg" style="font-size:40px;transform:scale(0);transition:transform .2s">🥚</div>
        </div>`).join('')}
      </div>
    </div>`;
    setStats(`<div class="game-stat">🥚 ${eggs}</div><div class="game-stat">⏱️ ${timeLeft}s</div>`); }
  function show() { if (!playing) return;
    const els = document.querySelectorAll('.egg');
    if (activeHole >= 0 && els[activeHole]) els[activeHole].style.transform = 'scale(0)';
    activeHole = Math.floor(Math.random() * 9);
    if (els[activeHole]) els[activeHole].style.transform = 'scale(1)';
    const h = activeHole;
    setTimeout(() => { if (els[h] && activeHole === h) { els[h].style.transform = 'scale(0)'; if (activeHole === h) activeHole = -1; } }, 1200); }
  function tap(i) { if (!playing) return;
    const el = document.querySelector(`[data-i="${i}"] .egg`);
    if (!el || el.style.transform !== 'scale(1)') { sound.wrong(); return; }
    eggs++; sound.pop(); el.style.transform = 'scale(0)';
    if (eggs % 2 === 0) earn(5);
    setStats(`<div class="game-stat">🥚 ${eggs}</div><div class="game-stat">⏱️ ${timeLeft}s</div>`);
    activeHole = -1; }
  window._eggsTap = tap;
  interval = setInterval(show, 800);
  timerInt = setInterval(() => { timeLeft--; setStats(`<div class="game-stat">🥚 ${eggs}</div><div class="game-stat">⏱️ ${timeLeft}s</div>`);
    if (timeLeft <= 0) { playing = false; clearInterval(interval); clearInterval(timerInt);
      const coins = Math.floor(eggs / 2) + 5; earn(coins); sound.win(); confetti(30);
      setTimeout(() => showModal('🐰', "Hunt Over!", `Found ${eggs} eggs<br>+🪙 ${coins}`, 'Play Again', () => { closeGame(); setTimeout(() => openGame('easter-hunt'), 200); }), 400); } }, 1000);
  render();
  return () => { clearInterval(interval); clearInterval(timerInt); delete window._eggsTap; };
}
