<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 World Chef Fever · Multi-Country Cooking Game</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            user-select: none;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 30% 10%, #2a3a20, #0f180a 90%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-wrapper {
            max-width: 1500px;
            width: 100%;
            background: linear-gradient(145deg, #f5ebd8, #e0d0b0);
            border-radius: 50px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.9), inset 0 2px 8px rgba(255, 255, 220, 0.7);
            padding: 18px;
            border: 3px solid #b89b5e;
            position: relative;
        }

        /* ===== WORLD MAP SELECTION SCREEN ===== */
        .world-screen {
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 600px;
        }
        .world-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e1c14;
            border-radius: 60px;
            padding: 10px 24px;
            color: #ffefc0;
            box-shadow: inset 0 -6px 0 #0c0a05, 0 10px 20px rgba(0,0,0,0.6);
            border: 1px solid #c9a85e;
        }
        .world-header h1 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 3px;
            color: #fde5a2;
            text-shadow: 0 3px 0 #5a3e1a;
        }
        .world-stats {
            display: flex;
            gap: 20px;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .countries-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 10px;
        }
        .country-card {
            background: #e6d8bc;
            border-radius: 40px;
            padding: 20px 16px;
            box-shadow: inset 0 0 0 4px #b8a27b, 0 14px 20px #00000055;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid #a08b5e;
        }
        .country-card:hover {
            transform: translateY(-5px);
            box-shadow: inset 0 0 0 4px #d4b87a, 0 20px 30px #00000077;
        }
        .country-flag {
            font-size: 4.5rem;
            filter: drop-shadow(0 6px 6px #00000060);
        }
        .country-name {
            font-size: 1.5rem;
            font-weight: 900;
            color: #2d2a1c;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .country-desc {
            font-size: 0.85rem;
            color: #5a4b2e;
            text-align: center;
            font-weight: 600;
        }
        .country-progress {
            width: 100%;
            height: 12px;
            background: #4a3f2a;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px black;
        }
        .country-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e6b422, #ffd966);
            transition: width 0.3s;
        }

        /* ===== RESTAURANT SELECTION SCREEN ===== */
        .restaurant-screen {
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 600px;
        }
        .restaurant-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e1c14;
            border-radius: 60px;
            padding: 10px 24px;
            color: #ffefc0;
            box-shadow: inset 0 -6px 0 #0c0a05, 0 10px 20px rgba(0,0,0,0.6);
            border: 1px solid #c9a85e;
        }
        .back-btn {
            background: #8b6b41;
            border: none;
            border-radius: 30px;
            padding: 8px 20px;
            color: #ffeeb0;
            font-weight: 800;
            font-size: 1rem;
            box-shadow: 0 5px 0 #4e3a24;
            cursor: pointer;
            transition: all 0.08s;
        }
        .back-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #4e3a24;
        }
        .restaurants-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 10px;
        }
        .restaurant-card {
            background: #dacfb8;
            border-radius: 40px;
            padding: 20px 16px;
            box-shadow: inset 0 0 0 4px #b8a27b, 0 12px 18px #00000044;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid #a08b5e;
        }
        .restaurant-card:hover {
            transform: scale(1.02);
            box-shadow: inset 0 0 0 4px #d4b87a, 0 16px 24px #00000066;
        }
        .restaurant-emoji {
            font-size: 4rem;
            filter: drop-shadow(0 4px 4px #00000070);
        }
        .restaurant-name {
            font-size: 1.3rem;
            font-weight: 800;
            color: #2d2a1c;
            text-align: center;
        }
        .restaurant-level {
            font-size: 1rem;
            font-weight: 700;
            color: #5a4b2e;
            background: #e0d0b0;
            padding: 4px 16px;
            border-radius: 30px;
            box-shadow: inset 0 2px 4px #00000044;
        }
        .stars {
            display: flex;
            gap: 6px;
            font-size: 1.2rem;
            color: #e6b422;
            text-shadow: 0 2px 0 #5a3e1a;
        }

        /* ===== GAMEPLAY SCREEN ===== */
        .gameplay-screen {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* STATUS BAR */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e1c14;
            border-radius: 80px;
            padding: 8px 20px;
            color: #ffefc0;
            box-shadow: inset 0 -6px 0 #0c0a05, 0 10px 20px rgba(0,0,0,0.6);
            border: 1px solid #c9a85e;
            flex-wrap: wrap;
            gap: 6px;
        }
        .stat-box {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 800;
            font-size: 1.1rem;
            background: #2b261b;
            padding: 4px 14px;
            border-radius: 50px;
            box-shadow: inset 0 2px 5px #00000088, 0 3px 0 #6b562e;
            letter-spacing: 0.5px;
            border: 1px solid #907e4e;
        }
        .stat-box span:last-child {
            color: #fde5a2;
            min-width: 40px;
            text-align: center;
        }
        .icon {
            font-size: 1.4rem;
            filter: drop-shadow(0 2px 2px black);
        }
        .combo-indicator {
            background: #b35117;
            color: #ffd966;
            font-weight: 900;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 1.1rem;
            text-shadow: 0 2px 0 #4a1f00;
            box-shadow: 0 4px 0 #5a2e0a;
        }

        /* MAIN GRID */
        .main-grid {
            display: grid;
            grid-template-columns: 170px 1fr 1.2fr 190px;
            gap: 14px;
            min-height: 500px;
        }
        @media (max-width: 1150px) {
            .main-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .panel {
            background: #dacfb8;
            border-radius: 36px;
            padding: 14px 10px;
            box-shadow: inset 0 0 0 4px #b8a27b, 0 12px 18px #00000044;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid #8f7c56;
        }
        .panel-title {
            text-align: center;
            font-weight: 900;
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #2d2a1c;
            text-shadow: 0 1px 0 #fff2d0;
            letter-spacing: 2px;
            background: #c4ab7a;
            border-radius: 40px;
            padding: 6px 0;
            margin-top: -24px;
            box-shadow: 0 5px 0 #7b683f;
        }

        .ingredient-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .ingredient-btn {
            background: #fcf3e0;
            border: none;
            border-radius: 30px;
            padding: 8px 2px;
            font-size: 1.6rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 5px 0 #ae9468, 0 6px 10px #00000040;
            cursor: pointer;
            transition: all 0.05s ease;
            font-weight: bold;
            color: #453e2b;
            line-height: 1.1;
            border: 1px solid #d4b98a;
        }
        .ingredient-btn span {
            font-size: 0.55rem;
            font-weight: 800;
            color: #554b31;
            text-transform: uppercase;
            margin-top: 2px;
        }
        .ingredient-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #ae9468, 0 4px 10px #00000040;
        }
        .ingredient-btn:disabled {
            opacity: 0.4;
            transform: translateY(3px);
            box-shadow: 0 2px 0 #7b6947;
            filter: grayscale(0.6);
            cursor: not-allowed;
        }
        .ingredient-btn.highlight {
            box-shadow: 0 0 0 3px #f7d44a, 0 5px 0 #ae9468;
            background: #fff8e0;
        }

        .stations-panel {
            background: #3a392e;
            border-radius: 36px;
            padding: 14px 10px;
            box-shadow: inset 0 0 0 5px #6b5f4b, 0 12px 25px #00000070;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .station-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }
        .station-btn {
            background: #756b56;
            border: none;
            border-radius: 30px;
            padding: 8px 6px;
            font-size: 0.8rem;
            font-weight: 800;
            color: #ffefc0;
            box-shadow: 0 6px 0 #3f3728, 0 6px 10px black;
            cursor: pointer;
            transition: all 0.08s;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 65px;
            border: 1px solid #a39064;
        }
        .station-btn span:first-child {
            font-size: 1.5rem;
            margin-bottom: 1px;
        }
        .station-btn.active {
            background: #b68b40;
            box-shadow: 0 0 0 3px #f7d44a, 0 6px 0 #6b4e1e;
            transform: scale(1.02);
        }
        .station-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #3f3728;
        }
        .station-btn:disabled {
            opacity: 0.5;
            transform: translateY(3px);
            box-shadow: 0 2px 0 #2d271e;
        }

        .cooking-panel {
            background: #2d2b21;
            border-radius: 36px;
            padding: 14px 12px;
            box-shadow: inset 0 0 0 5px #5f5542, 0 12px 25px #00000070;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .order-header {
            background: #f1e7d3;
            border-radius: 36px;
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: inset 0 -4px 0 #ac9f84;
            flex-wrap: wrap;
        }
        .order-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.2rem;
            font-weight: 800;
            color: #2e2a1c;
        }
        .order-emojis {
            display: flex;
            gap: 6px;
            background: #dac29b;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 1.6rem;
            letter-spacing: 4px;
            box-shadow: inset 0 0 0 3px #b1966b;
            flex-wrap: wrap;
            max-width: 300px;
        }
        .progress-badge {
            font-size: 0.85rem;
            background: #5f543b;
            color: #f5e6c6;
            padding: 4px 14px;
            border-radius: 30px;
            font-weight: 700;
        }

        .plates-area {
            background: #1f1e18;
            border-radius: 36px;
            padding: 14px 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 14px;
            min-height: 120px;
            box-shadow: inset 0 0 25px #000000;
        }
        .plate {
            width: 90px;
            height: 90px;
            background: #ded9ce;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 7px 0 #7a6e56, 0 8px 16px black;
            font-size: 1.8rem;
            transition: all 0.15s;
            border: 3px solid #b8aa8a;
            line-height: 1;
            padding: 3px;
            position: relative;
        }
        .plate span {
            font-size: 0.65rem;
            font-weight: 800;
            color: #444;
            background: #eee7db;
            padding: 1px 6px;
            border-radius: 20px;
            margin-top: 2px;
        }
        .plate.ready {
            box-shadow: 0 0 0 4px #f7e05e, 0 7px 0 #7a6e56, 0 8px 16px black;
            background: #fff6e0;
        }
        .plate .station-tag {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #ffd966;
            font-size: 0.6rem;
            padding: 2px 8px;
            border-radius: 30px;
            white-space: nowrap;
            font-weight: 800;
        }

        .customer-panel {
            background: #cbb88b;
            border-radius: 36px;
            padding: 14px 10px;
            box-shadow: inset 0 0 0 4px #b8a27b, 0 12px 18px #00000033;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .customer-emoji {
            font-size: 3rem;
            text-align: center;
            filter: drop-shadow(0 5px 3px #00000070);
            background: #e9dcc7;
            border-radius: 50%;
            width: 75px;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            box-shadow: 0 6px 0 #8b7a5a, 0 8px 12px black;
        }
        .ticket {
            background: #fcf9f0;
            border-radius: 28px;
            padding: 12px 8px;
            box-shadow: inset 0 0 0 3px #cbb282, 0 6px 0 #7e6e4e;
            text-align: center;
        }
        .ticket-title {
            font-size: 0.8rem;
            font-weight: 900;
            color: #6b4f2b;
            letter-spacing: 1px;
        }
        .ticket-items {
            display: flex;
            justify-content: center;
            gap: 8px;
            font-size: 1.8rem;
            margin: 6px 0;
            background: #e7dac6;
            padding: 8px 4px;
            border-radius: 30px;
            flex-wrap: wrap;
        }
        .patience-bar {
            width: 100%;
            height: 8px;
            background: #5a4a30;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 4px;
            box-shadow: inset 0 2px 4px black;
        }
        .patience-fill {
            height: 100%;
            width: 100%;
            background: #3fba3f;
            transition: width 0.3s linear, background 0.3s;
        }

        .powerup-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 4px;
        }
        .powerup-btn {
            background: #8b6b41;
            border: none;
            border-radius: 26px;
            padding: 6px 4px;
            color: #ffeeb0;
            font-weight: 800;
            font-size: 0.65rem;
            box-shadow: 0 5px 0 #4e3a24, 0 5px 8px black;
            cursor: pointer;
            transition: all 0.06s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-transform: uppercase;
            border: 1px solid #b89b5e;
        }
        .powerup-btn span:first-child {
            font-size: 1.2rem;
            margin-bottom: 1px;
        }
        .powerup-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #4e3a24;
        }
        .powerup-btn:disabled {
            opacity: 0.4;
            transform: translateY(3px);
            box-shadow: 0 2px 0 #2d1f10;
            cursor: not-allowed;
        }

        .button-primary {
            background: #e6b422;
            border: none;
            border-radius: 50px;
            padding: 12px 16px;
            font-weight: 900;
            font-size: 1rem;
            letter-spacing: 1px;
            color: #2b2416;
            box-shadow: 0 7px 0 #9e7a2e, 0 6px 12px black;
            cursor: pointer;
            transition: all 0.08s;
            text-transform: uppercase;
            width: 100%;
        }
        .button-primary:active {
            transform: translateY(4px);
            box-shadow: 0 3px 0 #9e7a2e, 0 6px 12px black;
        }
        .button-primary:disabled {
            opacity: 0.45;
            transform: translateY(4px);
            box-shadow: 0 3px 0 #6b531e;
            pointer-events: none;
        }
        .secondary-btn {
            background: #7e8d6b;
            box-shadow: 0 6px 0 #4f5a3e;
            color: white;
            font-size: 0.85rem;
            padding: 8px;
        }

        .feedback {
            font-size: 0.75rem;
            font-weight: 700;
            color: #f9eec1;
            background: #3b3527;
            border-radius: 30px;
            padding: 6px 8px;
            text-align: center;
            box-shadow: inset 0 2px 5px black;
            min-height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.3px;
        }
        .combo-highlight {
            color: #ffb347;
            text-shadow: 0 0 8px #ffae00;
        }

        .hidden {
            display: none !important;
        }

        /* Level popup */
        .level-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #f5ebd8;
            border-radius: 40px;
            padding: 30px 50px;
            box-shadow: 0 20px 40px black;
            border: 3px solid #b89b5e;
            text-align: center;
            z-index: 100;
            display: none;
        }
        .level-popup h2 {
            font-size: 2rem;
            color: #2d2a1c;
            margin: 0 0 10px;
        }
        .level-popup p {
            font-size: 1.2rem;
            color: #5a4b2e;
            margin: 8px 0;
        }
        .level-popup button {
            margin-top: 16px;
        }
    </style>
</head>
<body>
<div class="game-wrapper" id="gameWrapper">
    <!-- WORLD SELECTION SCREEN -->
    <div class="world-screen" id="worldScreen">
        <div class="world-header">
            <h1>🌍 WORLD CHEF FEVER</h1>
            <div class="world-stats">
                <span>💰 $<span id="worldScore">0</span></span>
                <span>⭐ <span id="worldStars">0</span> / <span id="totalStars">180</span></span>
            </div>
        </div>
        <div class="countries-grid" id="countriesGrid"></div>
    </div>

    <!-- RESTAURANT SELECTION SCREEN -->
    <div class="restaurant-screen hidden" id="restaurantScreen">
        <div class="restaurant-header">
            <button class="back-btn" id="backToWorld">← Back to World</button>
            <h2 id="restaurantCountryTitle">🇮🇹 Italy</h2>
            <div style="width:100px;"></div>
        </div>
        <div class="restaurants-grid" id="restaurantsGrid"></div>
    </div>

    <!-- GAMEPLAY SCREEN -->
    <div class="gameplay-screen hidden" id="gameplayScreen">
        <div class="status-bar">
            <div class="stat-box"><span class="icon">💰</span> $<span id="scoreDisplay">0</span></div>
            <div class="stat-box"><span class="icon">⭐</span> LVL <span id="levelDisplay">1</span>/20</div>
            <div class="stat-box"><span class="icon">⏳</span> <span id="timeDisplay">90</span>s</div>
            <div class="stat-box"><span class="icon">❤️</span> <span id="livesDisplay">5</span></div>
            <div class="stat-box"><span class="icon">🔥</span> <span id="comboDisplay" class="combo-indicator">x1</span></div>
            <div class="stat-box"><span class="icon">🎯</span> <span id="ordersDisplay">0</span>/<span id="maxOrdersDisplay">6</span></div>
        </div>

        <div class="main-grid">
            <!-- LEFT: INGREDIENTS -->
            <div class="panel">
                <div class="panel-title">🧺 INGREDIENTS</div>
                <div class="ingredient-grid" id="ingredientGrid"></div>
                <div class="feedback" id="feedbackMsg">Tap to add</div>
            </div>

            <!-- CENTER-LEFT: STATIONS -->
            <div class="stations-panel">
                <div class="panel-title" style="background:#9b8a64; box-shadow:0 5px 0 #5a4d33;">⚙️ STATIONS</div>
                <div class="station-buttons" id="stationButtons"></div>
                <div class="feedback" id="stationFeedback">Select station</div>
                <button class="button-primary secondary-btn" id="exitToRestaurants" style="margin-top:auto; background:#8f6b4b; box-shadow:0 6px 0 #5a3f2b;">🏠 EXIT</button>
            </div>

            <!-- CENTER-RIGHT: COOKING AREA -->
            <div class="cooking-panel">
                <div class="order-header">
                    <div class="order-info">
                        <span>📋 ORDER</span>
                        <div class="order-emojis" id="orderEmojis">—</div>
                    </div>
                    <div class="progress-badge" id="progressText">0 / 0</div>
                </div>

                <div class="plates-area" id="platesArea"></div>

                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button class="button-primary" id="serveBtn" disabled>🍽️ SERVE</button>
                    <button class="button-primary secondary-btn" id="clearPlateBtn" style="flex:1;">🗑️ CLEAR</button>
                </div>
                <div class="feedback" id="orderHint">Complete the order!</div>
            </div>

            <!-- RIGHT: CUSTOMER & POWERUPS -->
            <div class="customer-panel">
                <div class="panel-title" style="background:#c4ab7a;">👤 CUSTOMER</div>
                <div class="customer-emoji" id="customerEmoji">👨‍🍳</div>
                <div class="ticket">
                    <div class="ticket-title">🍽️ WANTS</div>
                    <div class="ticket-items" id="ticketItems">—</div>
                    <div class="patience-bar">
                        <div class="patience-fill" id="patienceFill" style="width:100%"></div>

                let countryStars = 0;
                let countryMaxStars = 0;
                country.restaurants.forEach(rest => {
                    for (let lvl = 1; lvl <= 20; lvl++) {
                        const key = `${country.id}_${rest.id}_${lvl}`;
                        const stars = worldState.stars[key] || 0;
                        countryStars += stars;
                        countryMaxStars += 3;
                    }
                });
                totalStarsEarned += countryStars;
                totalPossible += countryMaxStars;

                const progressPercent = countryMaxStars > 0 ? (countryStars / countryMaxStars) * 100 : 0;

                card.innerHTML = `
                    <div class="country-flag">${country.flag}</div>
                    <div class="country-name">${country.name}</div>
                    <div class="country-desc">${country.desc}</div>
                    <div class="country-progress">
                        <div class="country-progress-fill" style="width:${progressPercent}%"></div>
                    </div>
                    <div style="font-size:0.8rem; font-weight:700; color:#5a4b2e;">
                        ⭐ ${countryStars} / ${countryMaxStars}
                    </div>
                `;

                card.addEventListener('click', () => showRestaurantScreen(country.id));
                countriesGrid.appendChild(card);
            });

            worldScore.textContent = totalStarsEarned * 50;
            worldStars.textContent = totalStarsEarned;
            totalStars.textContent = totalPossible;
        }

        function renderRestaurants() {
            restaurantsGrid.innerHTML = '';
            const country = worldState.currentCountry;
            if (!country) return;

            country.restaurants.forEach(restaurant => {
                const card = document.createElement('div');
                card.className = 'restaurant-card';

                // Calculate restaurant stars
                let restStars = 0;
                let restMaxStars = 0;
                for (let lvl = 1; lvl <= 20; lvl++) {
                    const key = `${country.id}_${restaurant.id}_${lvl}`;
                    const stars = worldState.stars[key] || 0;
                    restStars += stars;
                    restMaxStars += 3;
                }

                // Find max unlocked level
                const unlockKey = `${country.id}_${restaurant.id}`;
                const maxUnlocked = worldState.unlockedLevels[unlockKey] || 1;

                // Build stars display
                let starsHtml = '';
                for (let i = 0; i < 3; i++) {
                    starsHtml += i < Math.floor(restStars / 20) ? '⭐' : '☆';
                }

                card.innerHTML = `
                    <div class="restaurant-emoji">${restaurant.emoji}</div>
                    <div class="restaurant-name">${restaurant.name}</div>
                    <div class="restaurant-level">${restaurant.cuisine} · Level ${maxUnlocked}/20</div>
                    <div class="stars">${starsHtml}</div>
                    <div style="font-size:0.75rem; font-weight:700; color:#5a4b2e;">
                        ⭐ ${restStars} / ${restMaxStars}
                    </div>
                `;

                card.addEventListener('click', () => {
                    showGameplayScreen(country.id, restaurant.id);
                });

                restaurantsGrid.appendChild(card);
            });
        }

        // ==================== GAMEPLAY FUNCTIONS ====================
        function initGameplay() {
            const country = worldState.currentCountry;
            const restaurant = worldState.currentRestaurant;
            if (!country || !restaurant) return;

            // Get ingredients and recipes for this restaurant
            gameState.currentIngredients = country.ingredients;
            gameState.currentRecipes = country.recipes[restaurant.id] || [];

            // Determine current level to play
            const unlockKey = `${country.id}_${restaurant.id}`;
            const maxUnlocked = worldState.unlockedLevels[unlockKey] || 1;
            gameState.level = maxUnlocked;

            // Reset game state for this level
            gameState.score = 0;
            gameState.lives = 5;
            gameState.timeLeft = 90 + Math.min(gameState.level * 2, 30);
            gameState.currentOrder = [];
            gameState.currentPlate = [];
            gameState.ordersCompleted = 0;
            gameState.maxOrders = 5 + Math.floor(gameState.level / 3);
            gameState.gameActive = true;
            gameState.combo = 1;
            gameState.maxCombo = 5;
            gameState.selectedStation = 'prep';
            gameState.hintUsed = false;
            gameState.powerups = { time: 2, hint: 2, plate: 1, life: 1 };

            if (gameState.mainTimer) clearInterval(gameState.mainTimer);
            if (gameState.patienceTimer) clearInterval(gameState.patienceTimer);

            // Build stations from ingredients
            const stationSet = new Set();
            Object.values(gameState.currentIngredients).forEach(ing => {
                stationSet.add(ing.station);
            });
            gameState.currentStations = Array.from(stationSet).map(s => ({
                id: s,
                name: s.charAt(0).toUpperCase() + s.slice(1),
                emoji: s === 'prep' ? '🔪' : s === 'grill' ? '🔥' : s === 'fryer' ? '🍟' : '⚙️',
            }));

            buildIngredientButtons();
            buildStationButtons();

            updateStats();
            updateComboUI();
            updateOrdersUI();
            startNewOrder();
            renderPlates();
            updateServeButton();
            updatePowerupsUI();

            // Start main timer
            gameState.mainTimer = setInterval(() => {
                if (!gameState.gameActive) return;
                gameState.timeLeft -= 1;
                updateStats();
                if (gameState.timeLeft <= 0) {
                    gameState.timeLeft = 0;
                    updateStats();
                    endLevel(false);
                }
            }, 1000);
        }

        function updateOrdersUI() {
            ordersDisplay.textContent = gameState.ordersCompleted;
            maxOrdersDisplay.textContent = gameState.maxOrders;
        }

        function buildIngredientButtons() {
            ingredientGrid.innerHTML = '';
            const ingredients = gameState.currentIngredients;
            Object.keys(ingredients).forEach(ingId => {
                const ing = ingredients[ingId];
                const btn = document.createElement('button');
                btn.className = 'ingredient-btn';
                btn.dataset.id = ingId;
                btn.dataset.station = ing.station;
                btn.innerHTML = `${ing.emoji}<span>${ing.name}</span>`;
                btn.addEventListener('click', () => {
                    if (!gameState.gameActive) return;
                    addIngredient(ingId);
                });
                ingredientGrid.appendChild(btn);
            });

            // Highlight ingredients for selected station
            document.querySelectorAll('.ingredient-btn').forEach(btn => {
                btn.classList.toggle('highlight', btn.dataset.station === gameState.selectedStation);
            });
        }

        function buildStationButtons() {
            stationButtons.innerHTML = '';
            gameState.currentStations.forEach(station => {
                const btn = document.createElement('button');
                btn.className = 'station-btn' + (gameState.selectedStation === station.id ? ' active' : '');
                btn.dataset.id = station.id;
                btn.innerHTML = `<span>${station.emoji}</span><span>${station.name}</span>`;
                btn.addEventListener('click', () => {
                    if (!gameState.gameActive) return;
                    gameState.selectedStation = station.id;
                    document.querySelectorAll('.station-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    stationFeedback.textContent = `${station.emoji} ${station.name} selected`;
                    document.querySelectorAll('.ingredient-btn').forEach(ingBtn => {
                        ingBtn.classList.toggle('highlight', ingBtn.dataset.station === station.id);
                    });
                });
                stationButtons.appendChild(btn);
            });
        }

        function generateRandomOrder() {
            const recipes = gameState.currentRecipes;
            if (!recipes || recipes.length === 0) return ['bun', 'patty'];
            // Filter by complexity based on level
            const maxLen = Math.min(2 + Math.floor(gameState.level / 3), 5);
            const validRecipes = recipes.filter(r => r.length <= maxLen);
            const pool = validRecipes.length > 0 ? validRecipes : recipes;
            const template = pool[Math.floor(Math.random() * pool.length)];
            return [...template];
        }

        function startNewOrder() {
            if (!gameState.gameActive) return;
            if (gameState.patienceTimer) clearInterval(gameState.patienceTimer);

            gameState.currentOrder = generateRandomOrder();
            gameState.currentPlate = [];
            gameState.hintUsed = false;
            gameState.maxPatience = 30 - Math.min(gameState.level, 15) + gameState.currentOrder.length * 2;
            if (gameState.maxPatience < 10) gameState.maxPatience = 10;
            gameState.patienceLeft = gameState.maxPatience;

            updateOrderUI();
            renderPlates();
            updateServeButton();
            updatePowerupsUI();
            updatePatienceBar();
            orderHint.textContent = `Order: ${gameState.currentOrder.map(getEmoji).join(' ')}`;

            gameState.patienceTimer = setInterval(() => {
                if (!gameState.gameActive) return;
                gameState.patienceLeft = Math.max(0, gameState.patienceLeft - 0.1);
                updatePatienceBar();
                if (gameState.patienceLeft <= 0) {
                    clearInterval(gameState.patienceTimer);
                    orderFailed('Customer left!');
                }
            }, 100);
        }

        function updatePatienceBar() {
            const percent = (gameState.patienceLeft / gameState.maxPatience) * 100;
            patienceFill.style.width = `${Math.max(0, percent)}%`;
            if (percent < 30) patienceFill.style.background = '#e03a3a';
            else if (percent < 60) patienceFill.style.background = '#e0a53a';
            else patienceFill.style.background = '#3fba3f';
            patienceText.textContent = `⏱️ ${Math.ceil(gameState.patienceLeft)}s`;
        }

        function getEmoji(id) {
            const ing = gameState.currentIngredients[id];
            return ing ? ing.emoji : '❓';
        }

        function getStationForIngredient(id) {
            const ing = gameState.currentIngredients[id];
            return ing ? ing.station : 'prep';
        }

        function updateOrderUI() {
            const orderStr = gameState.currentOrder.map(getEmoji).join(' ');
            orderEmojis.textContent = orderStr || '—';
            ticketItems.textContent = orderStr || '—';
            progressText.textContent = `${gameState.currentPlate.length} / ${gameState.currentOrder.length}`;
        }

        function renderPlates() {
            platesArea.innerHTML = '';
            const plateDiv = document.createElement('div');
            plateDiv.className = 'plate' + (isPlateComplete() ? ' ready' : '');
            const displayItems = gameState.currentPlate.slice(0, 4).map(getEmoji).join('');
            plateDiv.textContent = displayItems || '🍽️';

            const span = document.createElement('span');
            span.textContent = gameState.currentPlate.length + ' item' + (gameState.currentPlate.length !== 1 ? 's' : '');
            plateDiv.appendChild(span);

            if (gameState.currentPlate.length > 0) {
                const lastIng = gameState.currentPlate[gameState.currentPlate.length - 1];
                const station = getStationForIngredient(lastIng);
                const stationObj = gameState.currentStations.find(s => s.id === station);
                if (stationObj) {
                    const tag = document.createElement('div');
                    tag.className = 'station-tag';
                    tag.textContent = `${stationObj.emoji} ${stationObj.name}`;
                    plateDiv.appendChild(tag);
                }
            }

            platesArea.appendChild(plateDiv);
        }

        function isPlateComplete() {
            if (gameState.currentPlate.length !== gameState.currentOrder.length) return false;
            for (let i = 0; i < gameState.currentOrder.length; i++) {
                if (gameState.currentPlate[i] !== gameState.currentOrder[i]) return false;
            }
            return true;
        }

        function updateServeButton() {
            serveBtn.disabled = !(isPlateComplete() && gameState.gameActive);
            clearPlateBtn.disabled = !(gameState.currentPlate.length > 0 && gameState.gameActive);
        }

        function addIngredient(ingredientId) {
            if (!gameState.gameActive) return;
            if (!gameState.currentOrder.length) return;

            const requiredStation = getStationForIngredient(ingredientId);
            if (requiredStation !== gameState.selectedStation) {
                feedbackMsg.textContent = `❌ Need ${requiredStation} station!`;
                return;
            }

            const nextExpected = gameState.currentOrder[gameState.currentPlate.length];
            if (ingredientId !== nextExpected) {
                feedbackMsg.textContent = `❌ Wrong! Need ${getEmoji(nextExpected)}`;
                gameState.combo = 1;
                updateComboUI();
                return;
            }

            gameState.currentPlate.push(ingredientId);
            feedbackMsg.textContent = `➕ ${getEmoji(ingredientId)} added`;

            renderPlates();
            updateOrderUI();
            updateServeButton();
            updatePowerupsUI();

            if (isPlateComplete()) {
                feedbackMsg.textContent = `✅ Order ready! Serve!`;
                orderHint.textContent = `Press SERVE!`;
            } else {
                const nextId = gameState.currentOrder[gameState.currentPlate.length];
                orderHint.textContent = `Next: ${getEmoji(nextId)} (${getStationForIngredient(nextId)})`;
            }
        }

        function serveOrder() {
            if (!gameState.gameActive) return;
            if (!isPlateComplete()) return;

            const baseEarn = 15 + gameState.currentOrder.length * 8;
            const levelBonus = gameState.level * 3;
            const comboMultiplier = gameState.combo;
            const earned = Math.floor((baseEarn + levelBonus) * comboMultiplier);

            gameState.score += earned;
            gameState.ordersCompleted++;

            if (gameState.combo < gameState.maxCombo) gameState.combo++;
            updateComboUI();

            feedbackMsg.textContent = `🎉 Served! +$${earned} (x${comboMultiplier})`;
            orderHint.textContent = `🔥 Combo x${gameState.combo}!`;

            if (gameState.ordersCompleted >= gameState.maxOrders) {
                endLevel(true);
                return;
            }

            updateStats();
            updateOrdersUI();
            startNewOrder();
        }

        function clearPlate() {
            if (!gameState.gameActive) return;
            if (gameState.currentPlate.length === 0) return;
            gameState.currentPlate = [];
            gameState.combo = 1;
            updateComboUI();
            feedbackMsg.textContent = `🗑️ Plate cleared`;
            renderPlates();
            updateOrderUI();
            updateServeButton();
        }

        function orderFailed(reason = 'Wrong order!') {
            if (!gameState.gameActive) return;
            gameState.lives--;
            gameState.combo = 1;
            updateComboUI();
            if (gameState.lives < 0) gameState.lives = 0;
            updateStats();
            feedbackMsg.textContent = `😡 ${reason} -1 life`;
            orderHint.textContent = `Customer angry...`;

            if (gameState.lives <= 0) {
                endLevel(false);
                return;
            }

            gameState.currentPlate = [];
            startNewOrder();
        }

        function endLevel(won) {
            gameState.gameActive = false;
            if (gameState.mainTimer) clearInterval(gameState.mainTimer);
            if (gameState.patienceTimer) clearInterval(gameState.patienceTimer);

            const country = worldState.currentCountry;
            const restaurant = worldState.currentRestaurant;
            const level = gameState.level;

            let starsEarned = 0;
            if (won) {
                // Calculate stars based on performance
                if (gameState.score > 800) starsEarned = 3;
                else if (gameState.score > 400) starsEarned = 2;
                else starsEarned = 1;

                // Save stars
                const key = `${country.id}_${restaurant.id}_${level}`;
                const existingStars = worldState.stars[key] || 0;
                if (starsEarned > existingStars) {
                    worldState.stars[key] = starsEarned;
                }

                // Unlock next level
                const unlockKey = `${country.id}_${restaurant.id}`;
                const currentMax = worldState.unlockedLevels[unlockKey] || 1;
                if (level < 20 && level >= currentMax) {
                    worldState.unlockedLevels[unlockKey] = level + 1;
                }

                // Update total stars
                recalcTotalStars();

                popupTitle.textContent = `⭐ Level ${level} Complete! ⭐`;
                popupMessage.textContent = `You earned $${gameState.score} and ${starsEarned} star(s)!`;
            } else {
                popupTitle.textContent = `💔 Level ${level} Failed`;
                popupMessage.textContent = `You earned $${gameState.score}. Try again!`;
            }

            levelPopup.style.display = 'block';
        }

        function recalcTotalStars() {
            let total = 0;
            Object.values(worldState.stars).forEach(s => total += s);
            worldState.totalStars = total;
        }

        function updateStats() {
            scoreDisplay.textContent = gameState.score;
            levelDisplay.textContent = gameState.level;
            timeDisplay.textContent = Math.ceil(gameState.timeLeft);
            livesDisplay.textContent = gameState.lives;
        }

        function updateComboUI() {
            comboDisplay.textContent = `x${gameState.combo}`;
            if (gameState.combo > 1) {
                comboDisplay.classList.add('combo-highlight');
            } else {
                comboDisplay.classList.remove('combo-highlight');
            }
        }

        function updatePowerupsUI() {
            powerupTime.disabled = gameState.powerups.time <= 0 || !gameState.gameActive;
            powerupHint.disabled = gameState.powerups.hint <= 0 || !gameState.gameActive || gameState.hintUsed;
            powerupPlate.disabled = gameState.powerups.plate <= 0 || !gameState.gameActive;
            powerupLife.disabled = gameState.powerups.life <= 0 || !gameState.gameActive;
            powerupTime.innerHTML = `<span>⏳</span>+15s (${gameState.powerups.time})`;
            powerupHint.innerHTML = `<span>💡</span>HINT (${gameState.powerups.hint})`;
            powerupPlate.innerHTML = `<span>✨</span>PERFECT (${gameState.powerups.plate})`;
            powerupLife.innerHTML = `<span>❤️</span>+1 LIFE (${gameState.powerups.life})`;
        }

        // ==================== POWERUPS ====================
        function usePowerupTime() {
            if (gameState.powerups.time <= 0 || !gameState.gameActive) return;
            gameState.powerups.time--;
            gameState.timeLeft += 15;
            updateStats();
            updatePowerupsUI();
            feedbackMsg.textContent = `⏳ +15 seconds!`;
        }

        function usePowerupHint() {
            if (gameState.powerups.hint <= 0 || !gameState.gameActive || gameState.hintUsed) return;
            gameState.powerups.hint--;
            gameState.hintUsed = true;
            const nextId = gameState.currentOrder[gameState.currentPlate.length];
            if (nextId) {
                document.querySelectorAll('.ingredient-btn').forEach(btn => {
                    if (btn.dataset.id === nextId) {
                        btn.classList.add('highlight');
                        setTimeout(() => btn.classList.remove('highlight'), 2000);
                    }
                });
                feedbackMsg.textContent = `💡 Hint: Add ${getEmoji(nextId)} (${getStationForIngredient(nextId)})`;
            }
            updatePowerupsUI();
        }

        function usePowerupPlate() {
            if (gameState.powerups.plate <= 0 || !gameState.gameActive) return;
            gameState.powerups.plate--;
            gameState.currentPlate = [...gameState.currentOrder];
            renderPlates();
            updateOrderUI();
            updateServeButton();
            feedbackMsg.textContent = `✨ Perfect plate! Serve now!`;
            orderHint.textContent = `Order ready!`;
            updatePowerupsUI();
        }

        function usePowerupLife() {
            if (gameState.powerups.life <= 0 || !gameState.gameActive) return;
            gameState.powerups.life--;
            gameState.lives = Math.min(gameState.lives + 1, 9);
            updateStats();
            updatePowerupsUI();
            feedbackMsg.textContent = `❤️ +1 life!`;
        }

        // ==================== EVENT LISTENERS ====================
        backToWorld.addEventListener('click', showWorldScreen);
        exitToRestaurants.addEventListener('click', () => {
            if (gameState.mainTimer) clearInterval(gameState.mainTimer);
            if (gameState.patienceTimer) clearInterval(gameState.patienceTimer);
            gameState.gameActive = false;
            showRestaurantScreen(worldState.currentCountry.id);
        });

        serveBtn.addEventListener('click', () => {
            if (isPlateComplete()) serveOrder();
            else feedbackMsg.textContent = `❌ Order incomplete!`;
        });

        clearPlateBtn.addEventListener('click', clearPlate);

        powerupTime.addEventListener('click', usePowerupTime);
        powerupHint.addEventListener('click', usePowerupHint);
        powerupPlate.addEventListener('click', usePowerupPlate);
        powerupLife.addEventListener('click', usePowerupLife);

        popupContinue.addEventListener('click', () => {
            levelPopup.style.display = 'none';
            if (gameState.gameActive === false) {
                // Check if level was won or lost
                const country = worldState.currentCountry;
                const restaurant = worldState.currentRestaurant;
                const unlockKey = `${country.id}_${restaurant.id}`;
                const maxUnlocked = worldState.unlockedLevels[unlockKey] || 1;
                const currentLevel = gameState.level;

                if (currentLevel >= 20 && maxUnlocked >= 20) {
                    // Completed all levels
                    showRestaurantScreen(country.id);
                } else {
                    // Restart same level or go to next
                    showGameplayScreen(country.id, restaurant.id);
                }
            }
        });

        // ==================== INITIALIZE ====================
        // Initialize with some stars for demo
        function initDemoData() {
            // Give some stars to make it look progressed
            worldState.stars['italy_trattoria_1'] = 3;
            worldState.stars['italy_trattoria_2'] = 2;
            worldState.stars['italy_pizzeria_1'] = 3;
            worldState.stars['japan_sushiya_1'] = 2;
            worldState.stars['mexico_taqueria_1'] = 1;
            worldState.unlockedLevels['italy_trattoria'] = 3;
            worldState.unlockedLevels['italy_pizzeria'] = 2;
            worldState.unlockedLevels['japan_sushiya'] = 2;
            worldState.unlockedLevels['mexico_taqueria'] = 2;
            recalcTotalStars();
        }

        initDemoData();
        showWorldScreen();
    })();
</script>
</body>
</html>
